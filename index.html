ESSAY("kt1","k3","Nêu ít nhất 4 quy định an toàn khi làm việc trong phòng thực hành. Vì sao phải tuân thủ các quy định đó?",["Chỉ làm thí nghiệm khi có sự hướng dẫn và cho phép của giáo viên.","Không ăn uống, đùa nghịch; không nếm, ngửi trực tiếp hóa chất; đeo kính, găng tay bảo hộ khi cần.","Sử dụng dụng cụ đúng cách; báo ngay cho giáo viên khi có sự cố (đổ hóa chất, vỡ dụng cụ, bị thương).","Thu dọn, rửa sạch dụng cụ, rửa tay sau khi làm thí nghiệm.","Tuân thủ để tránh tai nạn (bỏng, ngộ độc, cháy nổ), bảo vệ bản thân, người khác và thiết bị."]);
ESSAY("kt2","k3","Em hãy trình bày các bước sử dụng kính lúp để quan sát gân của một chiếc lá cây.",["Tay trái cầm kính lúp, để mặt kính gần sát chiếc lá.","Mắt nhìn vào mặt kính.","Từ từ đưa kính lúp ra xa chiếc lá cho đến khi nhìn thấy rõ các gân lá.","Quan sát, ghi chép hoặc vẽ lại hình ảnh; giữ gìn mặt kính sạch, không để rơi vỡ."]);
ESSAY("kt3","k2","Kể tên các lĩnh vực chủ yếu của khoa học tự nhiên. Với mỗi lĩnh vực, hãy lấy một ví dụ về hiện tượng hoặc ứng dụng trong đời sống.",["Vật lí: nghiên cứu vật chất, năng lượng, chuyển động. Ví dụ: bóng đèn sáng khi có dòng điện.","Hóa học: nghiên cứu chất và sự biến đổi của chất. Ví dụ: đinh sắt bị gỉ, nấu ăn.","Sinh học: nghiên cứu vật sống. Ví dụ: cây xanh quang hợp, sản xuất vắc-xin.","Khoa học Trái Đất và Thiên văn học: ví dụ dự báo thời tiết, nghiên cứu Mặt Trăng, các vì sao."]);
ESSAY("kt4","k4","Trình bày các bước đo chiều dài của chiếc bàn học bằng thước. Bàn dài khoảng 1,2 m; em nên chọn thước có GHĐ 30 cm hay thước cuộn có GHĐ 2 m? Vì sao?",["Bước 1: Ước lượng chiều dài cần đo để chọn thước có GHĐ và ĐCNN phù hợp.","Bước 2: Đặt thước dọc theo chiều dài bàn, một đầu bàn ngang với vạch số 0 của thước.","Bước 3: Đặt mắt nhìn theo hướng vuông góc với cạnh thước ở đầu kia của bàn; đọc và ghi kết quả theo vạch chia gần nhất.","Nên chọn thước cuộn GHĐ 2 m vì GHĐ lớn hơn chiều dài bàn, đo một lần là được, kết quả chính xác hơn so với dùng thước 30 cm đo nhiều lần."]);
ESSAY("kt5","k4","Quan sát một chiếc thước kẻ: số lớn nhất ghi trên thước là 20; giữa vạch số 0 và vạch số 1 (cm) có 10 khoảng chia bằng nhau.\na) Xác định GHĐ và ĐCNN của thước.\nb) Dùng thước này đo chiều dài chiếc bút chì, đầu bút nằm gần vạch 14,5 cm nhất. Ghi kết quả đo.",["a) GHĐ của thước là 20 cm.","ĐCNN: 1 cm chia thành 10 khoảng → mỗi khoảng 0,1 cm = 1 mm.","b) Kết quả đo: chiều dài bút chì là 14,5 cm (ghi theo ĐCNN 0,1 cm).","Khi đọc kết quả phải đặt mắt vuông góc với cạnh thước, đọc theo vạch gần nhất với đầu vật."]);
ESSAY("kt6","k5","Nêu các bước đo khối lượng một túi gạo bằng cân đồng hồ. Mẹ mua một túi gạo 5 kg và một túi đường 1,5 kg. Tổng khối lượng hai túi là bao nhiêu kg? Bao nhiêu gam?",["Bước 1: Ước lượng khối lượng vật để chọn cân phù hợp; điều chỉnh kim cân về vạch số 0.","Bước 2: Đặt vật lên đĩa cân (đặt cân trên mặt phẳng nằm ngang).","Bước 3: Mắt nhìn vuông góc với mặt số, đọc và ghi kết quả theo vạch chia gần nhất.","Tổng khối lượng: 5 + 1,5 = 6,5 kg = 6 500 g."]);
ESSAY("kt7","k6","Trong giờ thể dục, An chạy 60 m hết 10 giây. Bình xuất phát lúc 7 giờ 45 phút 10 giây và về đích lúc 7 giờ 45 phút 22 giây. a) Bình chạy hết bao nhiêu giây? Ai chạy nhanh hơn? b) Nên dùng dụng cụ nào để đo thời gian chạy? Vì sao?",["a) Thời gian Bình chạy: 22 − 10 = 12 giây.","Cùng quãng đường 60 m, An chạy hết 10 giây, ít hơn Bình (12 giây) → An chạy nhanh hơn.","b) Nên dùng đồng hồ bấm giây (đồng hồ điện tử có chức năng bấm giây).","Vì đồng hồ bấm giây đo được chính xác đến phần nhỏ của giây, phù hợp đo khoảng thời gian ngắn."]);
ESSAY("kt8","k7","a) Biết t(°F) = t(°C) × 1,8 + 32. Hãy đổi 37°C sang °F và 77°F sang °C. b) Nêu các bước đo nhiệt độ cơ thể bằng nhiệt kế y tế điện tử.",["a) 37°C = 37 × 1,8 + 32 = 98,6°F.","77°F: t(°C) = (77 − 32) : 1,8 = 25°C.","b) Lau sạch đầu nhiệt kế; bấm nút khởi động.","Đặt đầu nhiệt kế vào nách (hoặc miệng) đúng cách, chờ đến khi có tiếng bíp; đọc kết quả trên màn hình rồi tắt và lau sạch nhiệt kế."]);
ESSAY("kt9","k8","Hãy gọi tên quá trình chuyển thể và giải thích các hiện tượng sau: a) Sáng sớm có sương đọng trên lá cây. b) Quần áo ướt phơi ngoài nắng một lúc thì khô. c) Cục nước đá để ngoài không khí tan thành nước.",["a) Sự ngưng tụ: hơi nước trong không khí gặp lạnh vào ban đêm, chuyển từ thể hơi sang thể lỏng, đọng thành giọt sương.","b) Sự bay hơi: nước trong quần áo chuyển từ thể lỏng sang thể hơi; nắng, gió làm bay hơi nhanh hơn.","c) Sự nóng chảy: nước đá nhận nhiệt từ không khí, chuyển từ thể rắn sang thể lỏng.","Các quá trình chuyển thể này xảy ra khi nhiệt độ thay đổi."]);
ESSAY("kt10","k8","Cho các hiện tượng: (1) Đường tan trong nước; (2) Đun nóng đường, đường chuyển thành chất màu đen có mùi khét; (3) Cồn để trong lọ hở bị bay hơi; (4) Cồn cháy tạo ra khí carbon dioxide và hơi nước. Hiện tượng nào thể hiện tính chất vật lí, hiện tượng nào thể hiện tính chất hóa học? Vì sao?",["Tính chất vật lí: (1) và (3).","Vì không có chất mới tạo thành, chất chỉ thay đổi trạng thái hoặc hòa tan.","Tính chất hóa học: (2) và (4).","Vì có chất mới được tạo thành (than, khí carbon dioxide, hơi nước…)."]);
ESSAY("kt11","k8","So sánh sự bay hơi và sự sôi của nước. Vì sao khi phơi quần áo vào ngày nắng to, có gió thì quần áo nhanh khô hơn?",["Giống nhau: đều là quá trình chuyển từ thể lỏng sang thể hơi.","Sự bay hơi xảy ra ở mọi nhiệt độ, chỉ trên mặt thoáng chất lỏng.","Sự sôi xảy ra ở nhiệt độ xác định (nước sôi ở 100°C), cả trong lòng và trên mặt thoáng chất lỏng.","Nắng to (nhiệt độ cao) và gió làm nước bay hơi nhanh hơn nên quần áo mau khô."]);
ESSAY("kt12","k9","Nêu tính chất vật lí và vai trò của oxygen. Vì sao khi có đám cháy nhỏ (ví dụ chảo dầu bốc cháy), người ta dùng vung đậy kín hoặc trùm chăn ướt lên để dập lửa?",["Tính chất vật lí: oxygen là chất khí không màu, không mùi, không vị, ít tan trong nước.","Vai trò: duy trì sự hô hấp của người, động vật; duy trì sự cháy (đun nấu, sản xuất).","Đậy vung hoặc trùm chăn ướt để ngăn oxygen tiếp xúc với chất cháy.","Thiếu oxygen thì sự cháy không duy trì được nên lửa tắt; chăn ướt còn làm giảm nhiệt độ."]);
ESSAY("kt13","k10","Không khí gồm những thành phần nào? Nêu 3 nguyên nhân gây ô nhiễm không khí và 3 biện pháp bảo vệ môi trường không khí mà em có thể làm.",["Thành phần: khoảng 78% nitrogen, 21% oxygen, 1% các khí khác (carbon dioxide, hơi nước…).","Nguyên nhân: khí thải từ xe cộ, nhà máy; đốt rác, đốt rơm rạ; cháy rừng, bụi xây dựng.","Biện pháp: trồng và chăm sóc cây xanh; đi xe đạp, phương tiện công cộng.","Không đốt rác; tiết kiệm điện; tuyên truyền mọi người cùng bảo vệ môi trường."]);
ESSAY("kt14","k9","Thí nghiệm: Đặt hai cây nến giống nhau đang cháy trên bàn, úp một cốc thủy tinh lên một cây nến. Sau một thời gian, cây nến bị úp cốc tắt, cây còn lại vẫn cháy. Hãy giải thích hiện tượng và rút ra kết luận.",["Khi úp cốc, lượng không khí (oxygen) trong cốc có hạn.","Nến cháy dùng hết dần oxygen trong cốc nên ngọn lửa yếu dần rồi tắt.","Cây nến không úp cốc vẫn được cung cấp oxygen từ không khí nên tiếp tục cháy.","Kết luận: oxygen cần cho sự cháy; không có oxygen thì sự cháy không xảy ra."]);
ESSAY("kt15","k11","Nêu tính chất và ứng dụng của 3 loại vật liệu: kim loại, nhựa, thủy tinh. Vì sao xoong, nồi thường làm bằng kim loại nhưng tay cầm lại làm bằng nhựa hoặc gỗ?",["Kim loại: dẫn điện, dẫn nhiệt tốt, cứng, bền → làm xoong nồi, dây điện, khung nhà.","Nhựa: nhẹ, dễ tạo hình, cách điện, cách nhiệt → làm đồ dùng, vỏ dây điện.","Thủy tinh: trong suốt, dễ vỡ, không gỉ → làm cửa kính, chai lọ, cốc.","Thân nồi bằng kim loại để dẫn nhiệt tốt, nấu nhanh; tay cầm bằng nhựa, gỗ vì cách nhiệt, không bị bỏng tay."]);
ESSAY("kt16","k12","Nhiên liệu là gì? Hãy phân loại nhiên liệu theo thể và lấy ví dụ. Nêu các biện pháp sử dụng nhiên liệu an toàn, hiệu quả.",["Nhiên liệu là những chất cháy được, khi cháy tỏa nhiệt và phát sáng.","Nhiên liệu rắn: than, củi; lỏng: xăng, dầu, cồn; khí: gas, biogas, khí tự nhiên.","Sử dụng hiệu quả: cung cấp đủ oxygen (chẻ nhỏ củi, thông gió), điều chỉnh lượng nhiên liệu phù hợp.","Sử dụng an toàn: tránh xa chất dễ cháy, khóa van gas sau khi dùng, không để bếp cháy khi không có người."]);
ESSAY("kt17","k12","An ninh năng lượng là gì? Vì sao cần sử dụng nhiên liệu tiết kiệm và phát triển các nguồn năng lượng tái tạo?",["An ninh năng lượng là bảo đảm đủ năng lượng cho đời sống và sản xuất, ổn định, với giá hợp lí.","Nhiên liệu hóa thạch (than, dầu mỏ, khí đốt) có hạn, sẽ cạn kiệt và gây ô nhiễm môi trường.","Năng lượng tái tạo (mặt trời, gió, nước) sạch, không cạn kiệt.","Sử dụng tiết kiệm và phát triển năng lượng tái tạo giúp bảo đảm an ninh năng lượng, bảo vệ môi trường."]);
ESSAY("kt18","k11","Rác thải nhựa đang là vấn đề lớn ở nhiều nơi. Em hãy nêu tác hại của rác thải nhựa và đề xuất ít nhất 3 việc làm để giảm rác thải nhựa.",["Nhựa rất khó phân hủy (hàng trăm năm), gây ô nhiễm đất, nước, biển.","Động vật ăn phải nhựa có thể chết; đốt nhựa sinh khí độc hại.","Giảm thiểu: dùng túi vải, bình nước cá nhân, hạn chế đồ nhựa dùng một lần.","Tái sử dụng chai lọ; phân loại rác để tái chế (nguyên tắc 3R: giảm thiểu, tái sử dụng, tái chế)."]);
ESSAY("kt19","k4","Một bạn đo chiều dài quyển sách 3 lần, được các kết quả: 24,1 cm; 24,2 cm; 24,3 cm. a) Tính giá trị trung bình chiều dài quyển sách. b) Vì sao nên đo nhiều lần và lấy giá trị trung bình?",["a) Giá trị trung bình = (24,1 + 24,2 + 24,3) : 3.","= 72,6 : 3 = 24,2 cm.","b) Mỗi lần đo có thể có sai số (đặt thước, đặt mắt, đọc kết quả chưa chuẩn).","Đo nhiều lần và lấy trung bình giúp giảm sai số, kết quả chính xác hơn."]);
ESSAY("kt20","k4","Vì sao cần ước lượng trước khi đo? Em hãy chọn dụng cụ đo phù hợp cho các trường hợp sau và giải thích: a) chiều dài sân trường; b) chiều dài quyển vở; c) chu vi cổ tay.",["Ước lượng giúp chọn dụng cụ đo có GHĐ và ĐCNN phù hợp, đo nhanh và chính xác hơn.","a) Sân trường: thước cuộn (thước dây dài) vì độ dài lớn, cần GHĐ lớn.","b) Quyển vở: thước kẻ học sinh (GHĐ 20 – 30 cm, ĐCNN 1 mm).","c) Chu vi cổ tay: thước dây vì mềm, quấn được quanh cổ tay."]);

/* --- Bổ sung theo đề cương ôn tập GHKI của cô giáo (phạm vi Bài 1 – 15 theo đề cương = Bài 1 – 14 trong ngân hàng) --- */
ESSAY("kt21","k3","Kính hiển vi quang học dùng để làm gì? Nêu các bước cơ bản khi sử dụng kính hiển vi quang học.",["Kính hiển vi quang học dùng để quan sát những vật rất nhỏ mà mắt thường hoặc kính lúp không nhìn thấy được (tế bào, vi khuẩn…), phóng to từ 40 đến 3000 lần.","Bước 1: Chọn vật kính phù hợp với mẫu vật cần quan sát.","Bước 2: Điều chỉnh ánh sáng cho đủ sáng (gương, đèn).","Bước 3: Đặt tiêu bản lên bàn kính, dùng kẹp giữ; mắt nhìn vật kính, vặn ốc to hạ vật kính sát tiêu bản.","Bước 4: Mắt nhìn vào thị kính, vặn ốc to nâng vật kính lên đến khi thấy vật, rồi vặn ốc nhỏ để nhìn rõ."]);
ESSAY("kt22","k3","Các kí hiệu cảnh báo trong phòng thực hành có ý nghĩa gì? Nêu một số loại kí hiệu cảnh báo thường gặp và cách nhận biết.",["Kí hiệu cảnh báo giúp nhận biết nguy hiểm, nhắc nhở thực hiện đúng quy định để giữ an toàn.","Kí hiệu cảnh báo nguy hiểm (chất độc, dễ cháy, ăn mòn, điện cao thế…): hình tam giác viền đen hoặc đỏ, nền vàng.","Kí hiệu cấm (cấm lửa, cấm nước uống, cấm ăn uống…): hình tròn viền đỏ, nền trắng.","Kí hiệu bắt buộc thực hiện (đeo kính, đeo găng tay…): hình tròn nền xanh; kí hiệu chỉ dẫn (lối thoát hiểm, nơi rửa mắt…): hình vuông/chữ nhật nền xanh lá."]);
ESSAY("kt23","k5","Cần lựa chọn loại cân nào để đo khối lượng của một chiếc nhẫn, một túi gạo và một học sinh? Giải thích ngắn gọn. Đơn vị đo khối lượng hợp pháp ở Việt Nam là gì?",["Chiếc nhẫn: cân tiểu li (cân điện tử nhỏ) vì nhẫn rất nhẹ, cần ĐCNN rất nhỏ để đo chính xác.","Túi gạo: cân đồng hồ hoặc cân đòn vì túi gạo nặng vài kg đến vài chục kg.","Học sinh: cân sức khỏe (cân y tế) vì GHĐ lớn, phù hợp khối lượng cơ thể người.","Đơn vị đo khối lượng hợp pháp là kilôgam (kg); ngoài ra dùng gam (g), tấn…"]);
ESSAY("kt24","k8","Nêu một số đặc điểm cơ bản của chất ở thể rắn, thể lỏng và thể khí về hình dạng, thể tích và khả năng bị nén.",["Thể rắn: có hình dạng và thể tích xác định, rất khó bị nén.","Thể lỏng: có thể tích xác định nhưng không có hình dạng xác định (có hình dạng của vật chứa), khó bị nén.","Thể khí: không có hình dạng và thể tích xác định, chiếm toàn bộ vật chứa, dễ bị nén.","Ví dụ: hòn đá (rắn), nước (lỏng), hơi nước, không khí (khí)."]);
ESSAY("kt25","k10","Mô tả ngắn gọn cách tiến hành một thí nghiệm đơn giản để xác định gần đúng phần trăm thể tích oxygen trong không khí.",["Đặt một cây nến đang cháy vào giữa chậu nước, úp một ống đong (hoặc cốc thủy tinh có vạch chia) lên cây nến.","Nến cháy tiêu thụ hết oxygen trong ống rồi tắt.","Nước dâng lên trong ống, chiếm khoảng 1/5 thể tích ống.","Kết luận: oxygen chiếm khoảng 1/5 (khoảng 21%) thể tích không khí."]);
ESSAY("kt26","k13","Nguyên liệu là gì? Kể tên một số nguyên liệu thông dụng (quặng, đá vôi…) và nêu ứng dụng của chúng. Vì sao cần sử dụng nguyên liệu tiết kiệm, an toàn và hiệu quả?",["Nguyên liệu là vật liệu tự nhiên (vật liệu thô) chưa qua xử lí, cần được chế biến để tạo ra sản phẩm.","Quặng (quặng sắt, quặng nhôm, bauxite) dùng để sản xuất kim loại như gang, thép, nhôm.","Đá vôi dùng để sản xuất vôi sống, xi măng, làm vật liệu xây dựng; cát dùng sản xuất thủy tinh; dầu mỏ làm nhiên liệu, nhựa.","Nguyên liệu có hạn, khai thác nhiều gây cạn kiệt và ô nhiễm môi trường nên cần dùng tiết kiệm, tái chế để phát triển bền vững."]);
ESSAY("kt27","k14","Kể tên một số lương thực và thực phẩm thông dụng. Nêu vai trò của chúng và cách bảo quản để không bị hỏng.",["Lương thực: gạo, ngô, khoai, sắn, lúa mì… cung cấp chủ yếu tinh bột (chất bột đường).","Thực phẩm: thịt, cá, trứng, sữa, rau, quả… cung cấp chất đạm, chất béo, vitamin, chất khoáng.","Vai trò: cung cấp năng lượng và chất dinh dưỡng cho cơ thể hoạt động, lớn lên.","Bảo quản: để nơi khô ráo, thoáng mát; bảo quản lạnh thịt, cá, rau; đóng gói kín; chú ý hạn sử dụng."]);
ESSAY("kt28","k11","Vì sao cần lựa chọn và sử dụng vật liệu phù hợp với mục đích sử dụng? Nêu cách sử dụng vật liệu an toàn, hiệu quả và góp phần phát triển bền vững.",["Mỗi vật liệu có tính chất riêng (cứng, dẻo, dẫn điện, cách nhiệt, dễ vỡ, bị gỉ…).","Chọn đúng vật liệu giúp đồ vật bền, an toàn, tiết kiệm chi phí (ví dụ: dây điện có lõi đồng, vỏ nhựa).","Sử dụng an toàn, hiệu quả: dùng đúng mục đích, bảo quản đúng cách để tăng tuổi thọ.","Phát triển bền vững: tiết kiệm, tái sử dụng, tái chế vật liệu; hạn chế đồ nhựa dùng một lần."]);
ESSAY("kt29","k7","Kể tên một số loại nhiệt kế và đơn vị đo nhiệt độ thường dùng ở Việt Nam. Khi đo nhiệt độ của một chất lỏng, em cần lưu ý những thao tác nào để kết quả đo chính xác và an toàn?",["Nhiệt kế: nhiệt kế y tế (thủy ngân, điện tử), nhiệt kế rượu, nhiệt kế hồng ngoại; đơn vị thường dùng là độ C (°C).","Ước lượng nhiệt độ để chọn nhiệt kế có GHĐ và ĐCNN phù hợp.","Nhúng bầu nhiệt kế ngập trong chất lỏng, không chạm đáy và thành cốc; chờ cột chất lỏng trong nhiệt kế ổn định.","Đặt mắt nhìn ngang, đọc theo vạch chia gần nhất; cẩn thận với chất lỏng nóng, cầm nhiệt kế nhẹ nhàng tránh vỡ."]);

/* --- 5 đề KHTN: 20 câu trắc nghiệm (rải đều Bài 1 – 14) + 4 câu tự luận --- */
const KH_GK_SETS = (() => {
  const les = ["k1", "k2", "k3", "k4", "k5", "k6", "k7", "k8", "k9", "k10", "k11", "k12", "k13", "k14"];
  const quota = [1, 1, 2, 2, 1, 1, 2, 2, 2, 1, 2, 1, 1, 1];
  const mcBy = les.map((l) => BANK.filter((q) => q.les === l && q.t === "mc"));
  const essays = [["kt1", "kt23", "kt9", "kt26"], ["kt21", "kt5", "kt12", "kt27"], ["kt22", "kt7", "kt24", "kt17"], ["kt20", "kt29", "kt25", "kt28"], ["kt19", "kt6", "kt14", "kt26"]];
  const sets = [];
  for (let d = 0; d < 5; d++) {
    const mc = [];
    les.forEach((l, i) => {
      const list = mcBy[i], n = quota[(i + d) % quota.length];
      for (let k = 0, got = 0; got < n && k < list.length * 2; k++) { const q = list[(d * 2 + k * 3 + i) % list.length]; if (!mc.includes(q.id)) { mc.push(q.id); got++; } }
    });
    sets.push({ no: d + 1, mc, essays: essays[d], weights: { mc: 0.3, tf: 0.3, sa: 0.3 }, tnPts: 6, essayPts: 4 });
  }
  return sets;
})();

VL("s1");
M("Bạn Minh nói: “Lịch sử loài người và lịch sử tự nhiên là một.” Ý kiến nào nhận xét đúng?",["Chưa đúng, vì lịch sử loài người là quá khứ của xã hội loài người, còn lịch sử tự nhiên là quá khứ của tự nhiên","Đúng, vì cả hai đều là quá khứ","Đúng, vì môn Lịch sử học cả về núi, sông","Chưa đúng, vì lịch sử tự nhiên không có quá khứ"],1);
V("Một xã muốn xây khu du lịch nhưng phải san bằng một ngôi đình cổ. Từ hiểu biết về ý nghĩa của lịch sử, cách xử lí hợp lí nhất là",["Bảo tồn ngôi đình, chọn vị trí khác hoặc thiết kế khu du lịch gắn với di tích","Phá đình để xây nhanh","Di chuyển đình đi nơi khác bất kì","Để đình xuống cấp tự nhiên"],1);
T("Nhận định về vai trò của việc học lịch sử:",["+Hiểu quá khứ giúp ta giải thích được nhiều sự việc của hiện tại.","+Học lịch sử góp phần hình thành lòng yêu nước, tự hào dân tộc.","-Chỉ những người làm nghề sử học mới cần học lịch sử.","+Kinh nghiệm chống giặc của cha ông vẫn có giá trị tham khảo đến nay."],1);

VL("s2");
M("Để biết chắc chắn ngày khởi công xây dựng một ngôi trường, nguồn tư liệu nào đáng tin cậy nhất?",["Biên bản, văn bản của nhà trường được lập đúng thời điểm đó","Lời kể của một học sinh mới vào trường","Bài đăng trên mạng xã hội không rõ nguồn","Một bức tranh vẽ ngôi trường gần đây"],1);
M("Truyền thuyết “Sơn Tinh, Thủy Tinh” phản ánh điều gì có thật trong lịch sử?",["Cuộc sống chống chọi với lũ lụt của cư dân Việt cổ","Có hai vị thần đánh nhau thật","Người Việt cổ đã xây đập thủy điện","Người Việt cổ sống ở sa mạc"],1);
T("Khi sử dụng tư liệu truyền miệng để tìm hiểu lịch sử:",["+Tư liệu truyền miệng có thể chứa yếu tố hư cấu, cần đối chiếu.","+Tư liệu truyền miệng phản ánh phần nào đời sống, tâm tư của người xưa.","-Tư liệu truyền miệng có giá trị hơn mọi tư liệu khác.","+Nên kết hợp với tư liệu hiện vật, chữ viết để kết luận."],1);

VL("s4");
M("Điểm khác nhau cơ bản giữa Người tối cổ và Người tinh khôn là",["Người tinh khôn có cấu tạo cơ thể như người ngày nay, não lớn hơn, đôi tay khéo léo hơn","Người tối cổ biết chế tạo công cụ bằng sắt","Người tinh khôn còn lớp lông dày trên người","Người tối cổ xuất hiện sau Người tinh khôn"],1);
V("Việc tìm thấy nhiều di cốt Người tối cổ ở Đông Nam Á, trong đó có Việt Nam, giúp ta khẳng định",["Đông Nam Á, trong đó có Việt Nam là một trong những cái nôi của loài người","Người Việt xuất hiện từ châu Âu","Đông Nam Á không có người sinh sống","Loài người chỉ xuất hiện ở châu Phi"],1);
T("Sắp xếp đúng trình tự quá trình tiến hóa:",["+Vượn người xuất hiện trước Người tối cổ.","+Người tối cổ xuất hiện trước Người tinh khôn.","-Người tinh khôn tiến hóa thành Vượn người.","+Người tinh khôn là tổ tiên trực tiếp của người hiện đại."],1);

VL("s5");
M("Vì sao người nguyên thủy phải sống thành bầy đàn, cùng làm cùng hưởng?",["Vì công cụ thô sơ, sức lao động thấp, phải dựa vào nhau mới tồn tại được","Vì họ thích sống đông vui","Vì có luật bắt buộc","Vì họ đã giàu có"],1);
V("Từ đời sống “cùng làm, cùng hưởng” của người nguyên thủy, em rút ra bài học gì cho việc học nhóm ở lớp?",["Mọi người cùng góp sức, cùng chia sẻ kết quả thì công việc hiệu quả hơn","Chỉ một bạn làm, cả nhóm hưởng","Không cần hợp tác với ai","Ai giỏi thì làm riêng"],1);
T("Về đời sống tinh thần của người nguyên thủy ở Việt Nam:",["+Hình khắc mặt người trên vách hang Đồng Nội (Hòa Bình) thể hiện đời sống tinh thần.","+Đồ trang sức bằng vỏ ốc, đá cho thấy họ có nhu cầu làm đẹp.","-Người nguyên thủy đã có chữ viết để ghi chép.","+Việc chôn người chết cho thấy họ đã có tín ngưỡng."],1);

VL("s6");
M("Mối quan hệ nhân quả nào sau đây đúng?",["Công cụ kim loại → năng suất tăng → sản phẩm dư thừa → phân hóa giàu nghèo","Phân hóa giàu nghèo → có công cụ kim loại","Sản phẩm dư thừa → con người biết làm ra lửa","Gia đình phụ hệ → con người biết dùng đá"],1);
M("Vì sao xã hội nguyên thủy ở Việt Nam không phân hóa triệt để như ở một số nơi khác?",["Vì cư dân phải cùng nhau làm thủy lợi, chống giặc nên quan hệ cộng đồng (làng xã) vẫn bền chặt","Vì không có công cụ kim loại","Vì không có sản phẩm dư thừa","Vì không có người giàu"],1);
T("Về sự chuyển biến xã hội cuối thời nguyên thủy ở Việt Nam:",["+Các văn hóa Phùng Nguyên, Đồng Đậu, Gò Mun, Đông Sơn nối tiếp nhau phát triển.","+Đồ tùy táng trong mộ táng khác nhau phản ánh sự phân hóa giàu nghèo.","-Xã hội Việt Nam chuyển ngay sang chế độ tư bản.","+Đây là cơ sở cho sự ra đời của nhà nước Văn Lang."],1);

VL("s7");
M("Điểm giống nhau về điều kiện tự nhiên của Ai Cập và Lưỡng Hà cổ đại là",["đều hình thành bên lưu vực các con sông lớn, đất đai màu mỡ","đều có nhiều đồi núi, không có sông","đều giáp biển lạnh","đều nằm ở châu Âu"],1);
M("Vì sao người Ai Cập cổ đại giỏi hình học?",["Vì hằng năm sau lũ phải đo đạc lại ruộng đất và xây kim tự tháp","Vì họ học từ người Hy Lạp","Vì họ có máy tính","Vì họ thích vẽ hình"],1);
V("Nếu không có sông Nin, nền văn minh Ai Cập cổ đại có thể hình thành rực rỡ như vậy không? Vì sao?",["Khó có thể, vì sông Nin cung cấp nước, phù sa và là đường giao thông chính","Có, vì Ai Cập có nhiều mưa","Có, vì Ai Cập có nhiều rừng","Có, vì sa mạc rất màu mỡ"],1);

VL("s8");
M("Điểm khác biệt nổi bật trong tổ chức xã hội của Ấn Độ cổ đại so với Ai Cập, Lưỡng Hà là",["chế độ đẳng cấp Vác-na phân biệt khắt khe","có vua đứng đầu","có nông dân","có tầng lớp quý tộc"],1);
V("Ngày nay, mọi người đều bình đẳng trước pháp luật. So với chế độ Vác-na ở Ấn Độ cổ đại, điều này thể hiện",["sự tiến bộ, tôn trọng quyền con người","sự thụt lùi","không có gì khác","xã hội vẫn chia đẳng cấp như cũ"],1);

VL("d4");

VL("d5");

V("Bạn mới chuyển đến chưa thuộc đường. Lược đồ trí nhớ tốt nhất em vẽ cho bạn nên có",["điểm mốc dễ nhận biết, hướng rẽ, khoảng cách ước lượng","màu sắc thật đẹp, không cần điểm mốc","chỉ tên đường","tọa độ địa lí chính xác"],1);

VL("d6");

M("Nếu Trái Đất ở vị trí của Sao Hỏa (xa Mặt Trời hơn), điều gì có thể xảy ra?",["Trái Đất lạnh hơn nhiều, nước có thể đóng băng, sự sống khó tồn tại","Trái Đất nóng hơn","Không có gì thay đổi","Có thêm Mặt Trăng"],1);
T("Về vị trí và kích thước Trái Đất:",["+Trái Đất có kích thước lớn thứ 5 trong các hành tinh của hệ Mặt Trời.","+Nhờ khoảng cách hợp lí đến Mặt Trời, Trái Đất có nhiệt độ thích hợp cho sự sống.","-Trái Đất là hành tinh xa Mặt Trời nhất.","+Trái Đất có khối lượng đủ lớn để giữ được lớp khí quyển."],1);

VL("k1");

T("Về phương pháp tìm hiểu tự nhiên:",["+Quan sát, đặt câu hỏi, dự đoán, làm thí nghiệm, rút ra kết luận.","+Khi thí nghiệm, chỉ nên thay đổi một yếu tố để so sánh.","-Kết luận khoa học không cần dựa trên bằng chứng.","+Kết quả thí nghiệm cần được ghi chép trung thực."],1);

VL("k8");

M("Vì sao bình gas chứa được nhiều khí trong một thể tích nhỏ?",["Vì chất khí dễ bị nén","Vì chất khí không có khối lượng","Vì khí gas là chất rắn","Vì khí gas không chiếm chỗ"],1);

VL("k10");
S("Một phòng học có thể tích 200 m³ không khí. Thể tích oxygen trong phòng khoảng bao nhiêu m³?","42",1);

VL("k11");
M("Vì sao chảo chống dính có lòng phủ lớp chống dính, thân bằng nhôm và tay cầm bằng nhựa chịu nhiệt?",["Vì nhôm dẫn nhiệt tốt, nhựa cách nhiệt, lớp chống dính giúp thức ăn không bám","Vì để chảo nặng hơn","Vì nhựa dẫn nhiệt tốt","Vì nhôm cách nhiệt"],1);

VL("k12");

T("Về an ninh năng lượng ở Việt Nam:",["+Việt Nam có tiềm năng lớn về năng lượng mặt trời và gió.","+Tiết kiệm điện là góp phần bảo đảm an ninh năng lượng.","-Than đá và dầu mỏ của Việt Nam là vô hạn.","+Thủy điện tận dụng năng lượng của dòng nước."],1);

VL("k13");

VL("k14");

VL("t3");

VL("t4");

VL("t5");

V("Bạn em nghiện trò chơi trực tuyến, thức khuya và học sa sút. Lời khuyên phù hợp nhất là",["Lập thời gian biểu, giới hạn thời gian chơi, dành thời gian học và vận động","Chơi nhiều hơn để giỏi trò chơi","Bỏ học để chơi","Chơi vào ban đêm cho đỡ bị nhắc"],1);

VL("c3");
M("Một ngôi nhà có đèn tự bật khi trời tối, cửa tự khóa khi có người lạ, điều hòa bật qua điện thoại. Ngôi nhà này thể hiện đặc điểm nào?",["Tiện ích, an ninh an toàn","Chỉ tiết kiệm năng lượng","Không phải nhà thông minh","Chỉ trang trí"],1);
M("Hệ thống nào giúp tiết kiệm năng lượng nhất trong nhà thông minh?",["Cảm biến tự tắt đèn, điều hòa khi không có người","Camera an ninh","Chuông cửa có hình","Loa thông minh"],1);
T("Về ngôi nhà thông minh:",["+Nhà thông minh có thể tự gửi cảnh báo đến điện thoại khi có khói.","+Cần bảo mật tài khoản điều khiển nhà thông minh.","-Nhà thông minh không cần điện để hoạt động.","+Thiết bị thông minh hoạt động theo chương trình cài đặt sẵn."],1);

/* ---- GDCD ---- */
VL("g1");
M("Bạn T cho rằng: “Giữ gìn truyền thống là phải giữ nguyên mọi phong tục cũ.” Nhận xét nào đúng?",["Chưa đúng, cần giữ gìn truyền thống tốt đẹp và loại bỏ hủ tục lạc hậu","Hoàn toàn đúng","Đúng, vì cái gì cũ cũng tốt","Không cần giữ truyền thống"],1);
V("Gia đình em có truyền thống làm gốm. Em có thể phát huy truyền thống đó bằng cách",["tìm hiểu nghề, giới thiệu sản phẩm gốm trên mạng, học thêm kĩ năng","chê nghề gốm lạc hậu","giấu không cho ai biết","bỏ nghề ngay"],1);
T("Về truyền thống gia đình, dòng họ:",["+Truyền thống tốt đẹp là tài sản tinh thần quý giá.","+Học sinh phát huy truyền thống hiếu học bằng việc chăm chỉ học tập.","-Chỉ gia đình giàu có mới có truyền thống.","+Tự hào nhưng không khoe khoang về truyền thống gia đình."],1);

VL("g2");
M("Hành vi nào thể hiện lòng yêu thương con người một cách đúng đắn?",["Giúp bạn hiểu bài thay vì cho bạn chép bài","Cho bạn chép bài trong giờ kiểm tra","Bao che lỗi sai của bạn","Làm hộ bài tập cho bạn"],1);
V("Lớp em có bạn mới chuyển đến, rụt rè, chưa quen ai. Việc làm thể hiện yêu thương con người là",["chủ động làm quen, rủ bạn cùng chơi, giúp bạn hòa nhập","mặc kệ bạn","trêu chọc bạn","nói xấu bạn"],1);
T("Phân biệt yêu thương con người:",["+Quan tâm, chia sẻ với người gặp khó khăn.","+Tha thứ khi người khác biết hối lỗi.","-Thương hại, coi thường người nghèo.","+Lên án hành vi bạo lực, bắt nạt."],1);

VL("g3");
M("Siêng năng và kiên trì khác nhau ở điểm",["siêng năng là cần cù, chăm chỉ; kiên trì là quyết tâm làm đến cùng dù gặp khó khăn","siêng năng là bỏ cuộc giữa chừng","kiên trì là làm việc qua loa","hai đức tính hoàn toàn giống nhau"],1);
V("Em đặt mục tiêu luyện viết chữ đẹp nhưng sau 3 ngày thấy chưa tiến bộ nên muốn bỏ. Lời khuyên phù hợp là",["kiên trì luyện tập đều đặn mỗi ngày, xem lại cách viết, nhờ thầy cô góp ý","bỏ ngay vì không có năng khiếu","nhờ bạn viết hộ","chỉ luyện khi có kiểm tra"],1);
T("Về siêng năng, kiên trì:",["+Bác Hồ là tấm gương về tinh thần tự học kiên trì.","+Người siêng năng, kiên trì dễ thành công hơn.","-Siêng năng là làm việc liên tục không cần nghỉ ngơi.","+Có câu “Có công mài sắt, có ngày nên kim”."],1);
/* ===== CÂU NÂNG CAO – VẬN DỤNG (đợt 2: các bài còn lại của lớp 6), soạn mới theo SGK KNTT ===== */

/* ---- LỊCH SỬ ---- */
VL("s9");
M("Điểm giống nhau giữa nhà Tần và nhà Hán trong việc cai trị là",["đều xây dựng chế độ quân chủ trung ương tập quyền do hoàng đế đứng đầu","đều chia đất nước cho các nước nhỏ tự trị","đều theo chế độ dân chủ","đều không có quân đội"],1);
V("Ngày nay Vạn Lí Trường Thành là điểm du lịch nổi tiếng. Từ góc nhìn lịch sử, công trình này vừa là thành tựu vừa phản ánh",["sức lao động khổng lồ và nỗi vất vả của người dân thời xưa","cuộc sống nhàn hạ của nông dân","sự yếu kém của nhà Tần","việc người Trung Quốc không có kẻ thù"],1);
T("Về xã hội Trung Quốc thời Tần – Hán:",["+Địa chủ có nhiều ruộng đất, nông dân lĩnh canh phải nộp tô.","+Nhà Hán tồn tại lâu hơn nhà Tần.","-Nho giáo bị cấm hoàn toàn dưới thời nhà Hán.","+Giấy được cải tiến dưới thời nhà Hán."],1);

VL("s10");
M("Vì sao kinh tế Hy Lạp, La Mã cổ đại phát triển mạnh thủ công nghiệp và thương nghiệp thay vì nông nghiệp?",["Vì đất canh tác ít, khô cứng nhưng bờ biển nhiều vịnh, thuận lợi buôn bán đường biển","Vì có đồng bằng rộng lớn","Vì không có biển","Vì cấm trồng trọt"],1);
M("Điểm khác cơ bản giữa nền dân chủ A-ten và nhà nước Ai Cập cổ đại là",["A-ten có Đại hội nhân dân (công dân tham gia), Ai Cập do Pha-ra-ông nắm toàn quyền","A-ten do vua chuyên chế","Ai Cập có bầu cử","Hai nơi giống hệt nhau"],1);
T("Về di sản Hy Lạp, La Mã:",["+Nhiều thuật ngữ khoa học ngày nay có nguồn gốc Hy Lạp, La-tinh.","+Hệ chữ cái La-tinh là cơ sở của chữ Quốc ngữ Việt Nam.","-Nền dân chủ A-ten cho mọi người, kể cả nô lệ, quyền bầu cử.","+Kiến trúc cột tròn kiểu Hy Lạp vẫn xuất hiện ở nhiều công trình hiện đại."],1);

VL("s11");
M("Vì sao cư dân Đông Nam Á sớm trồng lúa nước?",["Vì khí hậu nóng ẩm, mưa nhiều, nhiều đồng bằng phù sa ven sông","Vì khí hậu lạnh khô","Vì không có sông","Vì toàn núi đá"],1);
V("Ngày nay các nước Đông Nam Á hợp tác trong tổ chức ASEAN. Điều này có cơ sở lịch sử từ",["sự gần gũi về điều kiện tự nhiên, văn hóa lúa nước và giao lưu từ thời cổ","việc các nước cùng nói một ngôn ngữ","việc các nước cùng một nhà nước từ xưa","việc các nước không có quan hệ"],1);
T("Về điều kiện hình thành các quốc gia sơ kì Đông Nam Á:",["+Nông nghiệp lúa nước phát triển tạo cơ sở kinh tế.","+Vị trí trên đường biển thúc đẩy giao lưu, buôn bán.","-Các quốc gia sơ kì ra đời hoàn toàn không chịu ảnh hưởng bên ngoài.","+Văn hóa Đông Sơn, Sa Huỳnh, Óc Eo là cơ sở của các quốc gia sơ kì trên đất Việt Nam."],1);

VL("s12");
M("Vì sao Sri Vi-giay-a trở thành vương quốc hùng mạnh ở hải đảo?",["Vì kiểm soát eo biển Ma-lắc-ca, nằm trên tuyến thương mại quốc tế","Vì có đồng bằng lớn nhất thế giới","Vì không có biển","Vì cấm buôn bán"],1);
V("Eo biển Ma-lắc-ca ngày nay vẫn là tuyến hàng hải rất quan trọng. Điều đó cho thấy",["vị trí địa lí quan trọng của Đông Nam Á từ xưa đến nay","eo biển đã bị lấp","Đông Nam Á không còn quan trọng","chỉ có giá trị thời cổ"],1);
T("Về các vương quốc phong kiến Đông Nam Á (VII – X):",["+Có vương quốc lục địa và vương quốc hải đảo.","+Các vương quốc lục địa dựa chủ yếu vào nông nghiệp.","-Mọi vương quốc đều chỉ sống bằng buôn bán.","+Thương cảng ven biển góp phần làm giàu cho các vương quốc."],1);

VL("s13");
M("Đặc điểm nổi bật trong việc tiếp thu văn hóa bên ngoài của cư dân Đông Nam Á là",["tiếp thu có chọn lọc và kết hợp với văn hóa bản địa","sao chép nguyên vẹn","từ chối hoàn toàn","chỉ tiếp thu từ châu Âu"],1);
V("Chùa Một Cột (Hà Nội) và tháp Chăm cho thấy văn hóa Việt Nam chịu ảnh hưởng của",["cả văn hóa Trung Hoa và Ấn Độ, được Việt hóa","chỉ văn hóa châu Âu","chỉ văn hóa Ai Cập","không chịu ảnh hưởng nào"],1);
T("Về giao lưu văn hóa ở Đông Nam Á (đầu Công nguyên – thế kỉ X):",["+Phật giáo, Hin-đu giáo được truyền vào qua con đường buôn bán.","+Chữ Phạn được cải biến thành chữ viết riêng của một số dân tộc.","-Hồi giáo là tôn giáo phổ biến nhất ở Đông Nam Á thời kì này.","+Đền Bô-rô-bu-đua và Thánh địa Mỹ Sơn là minh chứng giao lưu văn hóa."],1);

VL("s14");
M("Vì sao nhà nước Văn Lang ra đời ở lưu vực sông Hồng, sông Mã, sông Cả?",["Vì nhu cầu trị thủy, chống giặc và sản xuất nông nghiệp lúa nước","Vì nơi đây có sa mạc","Vì nơi đây không có người","Vì được nước ngoài giúp đỡ"],1);
M("Thành Cổ Loa được xây nhiều vòng, hình xoáy trôn ốc nhằm mục đích chủ yếu là",["phòng thủ vững chắc, thuận lợi tấn công và rút lui","trang trí cho đẹp","làm chợ buôn bán","làm nơi trồng lúa"],1);
T("Về tổ chức nhà nước Văn Lang:",["+Đứng đầu là Hùng Vương, giúp việc có Lạc hầu, Lạc tướng.","+Cả nước chia thành 15 bộ.","-Văn Lang đã có luật pháp thành văn và quân đội thường trực đông đảo.","+Đứng đầu các chiềng, chạ là Bồ chính."],1);

VL("s15");
M("Vì sao chính quyền phương Bắc thực hiện chính sách đồng hóa người Việt?",["Nhằm biến nước ta thành một phần lãnh thổ của Trung Quốc lâu dài","Nhằm giúp người Việt phát triển văn hóa","Nhằm bảo vệ phong tục Việt","Nhằm trả độc lập cho người Việt"],1);
V("Chính sách độc quyền sắt, muối của chính quyền đô hộ nhằm",["hạn chế người Việt chế tạo vũ khí, vơ vét của cải","giúp người Việt có nhiều sắt","giúp người Việt buôn bán tự do","không có mục đích gì"],1);
T("Chuyển biến xã hội Âu Lạc thời Bắc thuộc:",["+Kĩ thuật rèn sắt, dùng trâu bò cày kéo được phổ biến hơn.","+Xuất hiện tầng lớp địa chủ người Hán và người Việt.","-Người Việt hoàn toàn bị đồng hóa.","+Mâu thuẫn giữa nhân dân ta với chính quyền đô hộ ngày càng gay gắt."],1);

VL("s16");
M("Điểm chung của các cuộc khởi nghĩa Hai Bà Trưng, Bà Triệu, Lý Bí, Mai Thúc Loan, Phùng Hưng là",["đều nhằm chống ách đô hộ, giành độc lập cho dân tộc","đều thành công giữ độc lập lâu dài","đều do người nước ngoài lãnh đạo","đều chống quân Mông – Nguyên"],1);
S("Từ khởi nghĩa Hai Bà Trưng (năm 40) đến khi Lý Bí lập nước Vạn Xuân (năm 544) là bao nhiêu năm?","504",1);
T("Ý nghĩa các cuộc khởi nghĩa trước thế kỉ X:",["+Thể hiện ý chí đấu tranh giành độc lập không ngừng của dân tộc.","+Chuẩn bị cho thắng lợi hoàn toàn năm 938.","-Các cuộc khởi nghĩa đều giành được độc lập lâu dài.","+Để lại nhiều bài học về tinh thần đoàn kết."],1);

VL("s17");
M("Vì sao người Việt giữ được tiếng nói tổ tiên dù bị đô hộ hơn 1000 năm?",["Vì làng xã người Việt vẫn sinh hoạt bằng tiếng mẹ đẻ, lưu truyền văn hóa qua nhiều thế hệ","Vì chính quyền đô hộ khuyến khích","Vì người Việt không giao tiếp với ai","Vì người Hán học tiếng Việt"],1);
V("Ngày nay em có thể làm gì để giữ gìn bản sắc văn hóa dân tộc?",["Nói, viết tiếng Việt chuẩn mực, tìm hiểu và tham gia lễ hội truyền thống","Chỉ dùng tiếng nước ngoài","Chê các phong tục truyền thống","Không quan tâm đến văn hóa"],1);
T("Về cuộc đấu tranh bảo tồn văn hóa:",["+Truyền thuyết, ca dao phản ánh tinh thần dân tộc.","+Tín ngưỡng thờ Mẫu, thờ thần làng vẫn được duy trì.","-Người Việt bỏ tục thờ cúng tổ tiên.","+Người Việt sáng tạo cách đọc chữ Hán theo âm Việt."],1);

VL("s18");
M("Ngô Quyền chọn sông Bạch Đằng làm trận địa vì",["địa thế hiểm yếu, gần cửa biển, có thủy triều lên xuống mạnh","sông rất cạn","sông ở gần biên giới phía Bắc","sông không có nước"],1);
M("Sắp xếp đúng trình tự: (1) Khúc Thừa Dụ dựng quyền tự chủ; (2) Dương Đình Nghệ đánh quân Nam Hán; (3) Ngô Quyền chiến thắng Bạch Đằng",["(1) → (2) → (3)","(2) → (1) → (3)","(3) → (2) → (1)","(1) → (3) → (2)"],1);
V("Từ chiến thắng Bạch Đằng năm 938, em rút ra bài học gì?",["Biết tận dụng điều kiện tự nhiên, đoàn kết và sáng tạo để chiến thắng","Chỉ cần quân đông là thắng","Không cần chuẩn bị","Nên đầu hàng khi giặc mạnh"],1);

VL("s19");
M("Điểm giống nhau giữa Chăm-pa và Phù Nam là",["đều chịu ảnh hưởng văn hóa Ấn Độ, có kinh tế nông nghiệp kết hợp buôn bán đường biển","đều nằm ở Bắc Bộ","đều theo Nho giáo","đều không có chữ viết"],1);
V("Người Chăm làm ruộng bậc thang trên sườn đồi. Điều đó cho thấy",["sự sáng tạo, thích nghi với địa hình nhiều đồi núi ven biển","đất đai bằng phẳng","người Chăm không trồng lúa","người Chăm chỉ đánh cá"],1);
T("Về văn hóa Chăm-pa:",["+Người Chăm có tục hỏa táng người chết.","+Kiến trúc đền tháp Chăm thể hiện trình độ cao về xây dựng bằng gạch.","-Người Chăm dùng chữ hình nêm.","+Một số lễ hội Chăm như Ka-tê vẫn được tổ chức đến nay."],1);

VL("s20");
M("Vì sao Óc Eo trở thành thương cảng sầm uất?",["Vì nằm trên tuyến hàng hải quốc tế giữa Ấn Độ và Trung Quốc","Vì ở sâu trong núi","Vì có tuyết rơi","Vì cấm thuyền buôn"],1);
V("Các hiện vật Óc Eo được trưng bày ở bảo tàng giúp em hiểu điều gì về vùng đất Nam Bộ xưa?",["Từng có một nền văn hóa phát triển, buôn bán rộng rãi với thế giới","Nam Bộ xưa không có người ở","Nam Bộ xưa thuộc châu Âu","Nam Bộ xưa không có biển"],1);
T("Về vương quốc Phù Nam:",["+Phù Nam phát triển mạnh vào khoảng thế kỉ III – V.","+Cư dân Phù Nam giỏi nghề làm đồ trang sức, đúc tiền.","-Phù Nam tồn tại đến thế kỉ XV.","+Văn hóa Óc Eo là dấu tích của Phù Nam."],1);

/* ---- ĐỊA LÍ ---- */
VL("d9");
M("Buổi chiều, em đứng quay lưng về phía Mặt Trời lặn. Trước mặt em là hướng",["đông","tây","bắc","nam"],1);
V("Khi dùng ứng dụng bản đồ để đi bộ, hướng trên màn hình không khớp thực tế. Cách xử lí là",["xoay điện thoại hoặc hiệu chỉnh la bàn trong ứng dụng","đi theo hướng ngẫu nhiên","tắt ứng dụng","chạy thật nhanh"],1);
T("Xác định phương hướng ngoài thực tế:",["+Buổi sáng, bóng của em đổ về phía tây.","+Ban đêm ở nửa cầu Bắc, sao Bắc Cực chỉ hướng bắc.","-Kim la bàn chỉ hướng đông – tây.","+Có thể kết hợp nhiều cách để xác định hướng chính xác."],1);

VL("d10");
M("Vì sao con người chưa thể khoan sâu đến nhân Trái Đất?",["Vì nhiệt độ, áp suất cực lớn và lớp vỏ, man-ti rất dày","Vì nhân Trái Đất ở trên trời","Vì nhân Trái Đất là nước","Vì không ai cho phép"],1);
M("Vùng nào dưới đây có nguy cơ động đất, núi lửa cao nhất?",["Vùng tiếp giáp giữa các mảng kiến tạo","Trung tâm các mảng kiến tạo ổn định","Đồng bằng châu thổ","Giữa các sa mạc lớn"],1);
T("Về các mảng kiến tạo:",["+Mỗi năm các mảng chỉ dịch chuyển vài cm.","+Hai mảng tách xa nhau có thể hình thành sống núi giữa đại dương.","-Mảng kiến tạo chỉ có ở đáy đại dương.","+Sự dịch chuyển của các mảng làm thay đổi hình dạng các lục địa qua hàng triệu năm."],1);

VL("d11");
M("Ở vùng núi đá vôi, quá trình ngoại sinh nào tạo nên hang động, măng đá, nhũ đá?",["Nước hòa tan đá vôi (xâm thực, bồi tụ hóa học)","Núi lửa phun","Động đất","Gió thổi"],1);
V("Vì sao nhiều bờ sông bị sạt lở, trong khi bãi bồi ở chỗ khác lại mở rộng?",["Vì dòng nước bào mòn chỗ này và bồi tụ vật liệu ở chỗ khác","Vì sông không chảy","Vì có núi lửa","Vì động đất liên tục"],1);
T("Tác động của nội sinh và ngoại sinh:",["+Nội sinh tạo ra các dạng địa hình lớn như dãy núi.","+Ngoại sinh làm biến đổi, san bằng các địa hình đó.","-Ngoại sinh chỉ diễn ra trong lòng Trái Đất.","+Con người cũng có thể làm thay đổi địa hình (san lấp, khai thác mỏ)."],1);

VL("d12");
M("Vì sao vùng có núi lửa đã tắt thường đông dân cư?",["Vì đất đỏ badan màu mỡ, thuận lợi trồng cây công nghiệp","Vì luôn an toàn tuyệt đối","Vì không có mưa","Vì khí hậu lạnh"],1);
V("Nhật Bản xây nhà chống động đất bằng vật liệu nhẹ, kết cấu linh hoạt. Điều đó cho thấy",["con người có thể giảm thiệt hại thiên tai bằng khoa học, kĩ thuật","động đất không gây hại","Nhật Bản không có động đất","nhà càng nặng càng an toàn"],1);
T("Ứng phó với động đất, sóng thần:",["+Khi đang ở ngoài trời, tránh xa nhà cao tầng, cột điện.","+Chuẩn bị sẵn túi đồ khẩn cấp (nước, đèn pin, thuốc).","-Khi động đất, nên dùng thang máy để xuống nhanh.","+Sau động đất có thể có dư chấn, cần cẩn thận."],1);

VL("d13");
S("Một ngọn đồi có đỉnh cao 350 m so với mực nước biển, chân đồi cao 200 m. Độ cao tương đối của đồi là bao nhiêu mét?","150",1);
M("Vì sao đồng bằng châu thổ sông Hồng, sông Cửu Long tập trung đông dân?",["Vì đất phù sa màu mỡ, địa hình bằng phẳng, nguồn nước dồi dào","Vì có nhiều núi cao","Vì khí hậu lạnh giá","Vì ít sông ngòi"],1);
T("Về khoáng sản:",["+Than đá ở Quảng Ninh là khoáng sản năng lượng.","+Bô-xít ở Tây Nguyên dùng để sản xuất nhôm.","-Khoáng sản có thể tái tạo nhanh trong vài năm.","+Khai thác khoáng sản cần gắn với bảo vệ môi trường."],1);

VL("d14");
M("Trên lược đồ, hai sườn núi: sườn A các đường đồng mức cách nhau 2 mm, sườn B cách nhau 6 mm. Nhận xét đúng là",["sườn A dốc hơn sườn B","sườn B dốc hơn sườn A","hai sườn dốc như nhau","không xác định được"],1);
S("Trên lát cắt, điểm A ở độ cao 300 m, điểm B ở độ cao 750 m. Hai điểm chênh nhau bao nhiêu mét?","450",1);

VL("d15");
M("Vì sao càng lên cao không khí càng loãng, khó thở?",["Vì khí áp giảm, lượng oxygen trong mỗi lần hít thở ít hơn","Vì oxygen tăng","Vì không khí nóng hơn","Vì có nhiều mây"],1);
V("Vào mùa đông, miền Bắc nước ta chịu ảnh hưởng của gió mùa Đông Bắc. Điều này làm thời tiết",["lạnh, khô hoặc mưa phùn","nóng ẩm","oi bức","không thay đổi"],1);
T("Về khí áp và gió:",["+Gió Tây ôn đới thổi từ áp cao chí tuyến về áp thấp ôn đới.","+Gió càng mạnh khi chênh lệch khí áp càng lớn.","-Khí áp ở mọi nơi trên Trái Đất đều bằng nhau.","+Gió mùa thay đổi hướng theo mùa."],1);

VL("d16");
S("Đỉnh núi cao 2 500 m, chân núi (0 m) có nhiệt độ 28 °C. Biết lên cao 100 m giảm 0,6 °C, nhiệt độ ở đỉnh núi là bao nhiêu °C?","13",1);
M("Vì sao vùng ven biển có nhiệt độ ôn hòa hơn vùng sâu trong lục địa?",["Vì nước biển nóng lên và nguội đi chậm hơn đất liền","Vì ven biển ít nắng","Vì ven biển có nhiều nhà","Vì ven biển gần cực"],1);
T("Về mây và mưa:",["+Không khí bốc lên cao, lạnh đi, hơi nước ngưng tụ tạo thành mây.","+Sườn núi đón gió ẩm thường mưa nhiều hơn sườn khuất gió.","-Mưa đá chỉ xảy ra ở vùng cực.","+Lượng mưa được đo bằng vũ kế, đơn vị mm."],1);

VL("d17");
M("Câu “Đà Lạt có khí hậu mát mẻ quanh năm” nói về",["khí hậu","thời tiết hôm nay","nhiệt độ lúc 7 giờ","một cơn mưa"],1);
V("Nước biển dâng do biến đổi khí hậu ảnh hưởng nghiêm trọng nhất đến vùng nào ở Việt Nam?",["Đồng bằng sông Cửu Long","Tây Bắc","Tây Nguyên","Việt Bắc"],1);
T("Ứng phó với biến đổi khí hậu:",["+Giảm nhẹ: hạn chế phát thải khí nhà kính.","+Thích ứng: thay đổi giống cây trồng, xây đê, nhà chống bão.","-Biến đổi khí hậu chỉ là chuyện của các nước giàu.","+Mỗi học sinh có thể góp phần bằng việc làm nhỏ hằng ngày."],1);

VL("d18");
S("Tổng lượng mưa 12 tháng của một địa điểm: 6 tháng mùa mưa mỗi tháng 250 mm, 6 tháng mùa khô mỗi tháng 30 mm. Tổng lượng mưa năm là bao nhiêu mm?","1680",1);
M("Biểu đồ khí hậu có đường nhiệt độ cao quanh năm (trên 25 °C) và lượng mưa lớn. Đây có thể là địa điểm thuộc",["đới nóng","đới lạnh","đới ôn hòa","vùng cực"],1);

VL("d19");
M("Vì sao nói vòng tuần hoàn của nước giúp duy trì sự sống?",["Vì liên tục cung cấp nước ngọt cho lục địa, điều hòa khí hậu","Vì làm nước biển ngọt đi","Vì làm nước biến mất","Vì tạo ra núi lửa"],1);
V("Một bạn nói: “Nước có ở khắp nơi nên dùng thoải mái.” Em phản bác thế nào?",["Nước ngọt dùng được rất ít và đang bị ô nhiễm, cần tiết kiệm","Bạn nói đúng","Nước biển uống được","Nước ngầm vô tận"],1);
T("Về thủy quyển:",["+Thủy quyển gồm nước ở biển, đại dương, lục địa và hơi nước trong khí quyển.","+Băng tuyết ở hai cực chứa phần lớn nước ngọt.","-Nước ngọt chiếm phần lớn lượng nước trên Trái Đất.","+Rừng giúp giữ nước, điều hòa dòng chảy."],1);

VL("d20");
M("Vì sao sông ngòi nước ta có lũ vào mùa mưa và cạn vào mùa khô?",["Vì chế độ nước sông phụ thuộc chủ yếu vào lượng mưa theo mùa","Vì băng tan","Vì thủy triều","Vì gió thổi"],1);
V("Để hạn chế lũ quét ở vùng núi, biện pháp lâu dài hiệu quả nhất là",["bảo vệ và trồng rừng đầu nguồn","chặt cây để thoát nước","xây nhà ven suối","san lấp lòng suối"],1);
T("Về sông, hồ và nước ngầm:",["+Hồ thủy điện cung cấp điện, điều tiết lũ, tưới tiêu.","+Khai thác nước ngầm quá mức có thể gây sụt lún đất.","-Mọi hồ đều là hồ nhân tạo.","+Nước ngầm là nguồn nước sinh hoạt quan trọng."],1);

VL("d21");
M("Vì sao biển Đông có vai trò quan trọng đối với Việt Nam?",["Cung cấp hải sản, dầu khí, du lịch, giao thông và bảo vệ chủ quyền","Không có giá trị","Chỉ để tắm biển","Chỉ có nước mặn không dùng được"],1);
V("Vì sao ngư dân cần theo dõi bản tin thời tiết biển trước khi ra khơi?",["Để tránh bão, sóng lớn, đảm bảo an toàn","Để biết giá cá","Để biết giờ học","Không cần thiết"],1);
T("Về sóng, thủy triều, dòng biển:",["+Sóng thần có thể cao hàng chục mét, rất nguy hiểm.","+Thủy triều được ứng dụng để sản xuất điện ở một số nước.","-Dòng biển lạnh làm khí hậu ven bờ nóng ẩm hơn.","+Sóng biển chủ yếu do gió tạo ra."],1);

VL("d22");
M("Vì sao lớp đất ở rừng nhiệt đới bị chặt phá nhanh chóng bạc màu?",["Vì mưa lớn rửa trôi chất dinh dưỡng khi không còn cây che phủ","Vì đất có quá nhiều mùn","Vì khí hậu lạnh","Vì không có mưa"],1);
V("Gia đình em muốn trồng rau sạch trong thùng xốp. Để đất tốt, nên",["trộn đất với phân hữu cơ, tưới nước vừa đủ","dùng cát khô","dùng đất có nhiều rác nhựa","không tưới nước"],1);
T("Về các nhân tố hình thành đất:",["+Đá mẹ quyết định thành phần khoáng của đất.","+Khí hậu ảnh hưởng đến tốc độ phong hóa và hình thành đất.","-Sinh vật không ảnh hưởng gì đến đất.","+Đất hình thành cần thời gian rất dài."],1);

VL("d23");
M("Vì sao ở vùng nhiệt đới có số loài sinh vật phong phú hơn vùng ôn đới?",["Vì khí hậu nóng ẩm, mưa nhiều thuận lợi cho sinh vật phát triển","Vì ít ánh sáng","Vì lạnh giá","Vì không có nước"],1);
V("Một vùng rừng bị cháy, nhiều loài động vật mất nơi sống. Biện pháp phục hồi hợp lí là",["trồng lại rừng bằng cây bản địa, bảo vệ không cho săn bắt","bỏ mặc","xây nhà máy","đốt tiếp phần còn lại"],1);

VL("d24");
M("Đặc điểm nào giúp rừng mưa nhiệt đới có nhiều tầng cây?",["Khí hậu nóng ẩm quanh năm, cây cạnh tranh ánh sáng nên phát triển nhiều tầng","Khí hậu lạnh","Ít mưa","Đất cát khô"],1);
V("Vì sao nói mất rừng A-ma-dôn ảnh hưởng đến cả thế giới?",["Vì rừng hấp thụ nhiều CO₂, điều hòa khí hậu toàn cầu, là kho đa dạng sinh học","Vì chỉ ảnh hưởng nước Bra-xin","Vì rừng không có giá trị","Vì rừng tạo ra bão"],1);
T("Bảo vệ rừng nhiệt đới:",["+Rừng ngập mặn giúp chắn sóng, bảo vệ bờ biển.","+Cần khai thác gỗ có kế hoạch và trồng lại rừng.","-Đốt rừng làm nương rẫy giúp rừng phát triển.","+Du lịch sinh thái có thể giúp bảo vệ rừng nếu quản lí tốt."],1);

VL("d25");
M("Vì sao thiên nhiên thay đổi từ Xích đạo về hai cực?",["Vì lượng nhiệt Mặt Trời nhận được giảm dần theo vĩ độ","Vì độ cao giảm","Vì số dân giảm","Vì gần biển hơn"],1);
V("Một du khách đi từ Việt Nam đến Ca-na-đa vào tháng 1. Du khách cần chuẩn bị",["quần áo ấm vì đới ôn hòa đang mùa đông","quần áo mùa hè","đồ bơi","không cần chuẩn bị"],1);

VL("d26");
M("Khi trình bày kết quả tìm hiểu môi trường địa phương, cách nào giúp bài thuyết phục hơn?",["Dùng hình ảnh, số liệu thực tế và đề xuất giải pháp cụ thể","Chỉ nêu ý kiến cá nhân","Chép nguyên văn sách","Không cần minh chứng"],1);
V("Nhóm em phát hiện cây xanh ở công viên bị chặt nhiều. Đề xuất hợp lí là",["kiến nghị chính quyền trồng bù, tổ chức trồng và chăm sóc cây","chặt thêm cây","im lặng","viết lên cây"],1);

VL("d27");
S("Một tỉnh có 1 200 000 dân, diện tích 3 000 km². Mật độ dân số là bao nhiêu người/km²?","400",1);
M("Dân số tăng quá nhanh có thể gây ra",["thiếu việc làm, quá tải trường học, bệnh viện, ô nhiễm môi trường","nhiều tài nguyên hơn","giảm ô nhiễm","nhà ở rộng rãi hơn"],1);
T("Về phân bố dân cư thế giới:",["+Vùng hoang mạc, vùng cực thưa dân.","+Đô thị hóa làm dân số thành thị tăng nhanh.","-Dân cư phân bố đều trên mọi châu lục.","+Tô-ky-ô, Thượng Hải là những siêu đô thị."],1);

VL("d28");
M("Hoạt động nào thể hiện con người vừa khai thác vừa bảo vệ thiên nhiên?",["Trồng rừng xen canh, nuôi trồng thủy sản bền vững","Đánh bắt cá bằng mìn","Chặt rừng làm đồi trọc","Xả rác ra biển"],1);
V("Sau khi một khu vực bị khai thác cát trái phép, bờ sông bị sạt lở. Bài học rút ra là",["khai thác tài nguyên phải tuân theo quy định, tính đến hậu quả với tự nhiên","khai thác càng nhiều càng tốt","sạt lở không liên quan khai thác","không cần quản lí"],1);

VL("d29");
M("Ví dụ nào là “khai thác thông minh” tài nguyên?",["Lắp điện mặt trời trên mái nhà, tái sử dụng nước mưa","Khai thác than không giới hạn","Đốt rơm rạ","Bơm nước ngầm thoải mái"],1);
V("Trường em muốn giảm rác thải nhựa. Đề xuất có tính bền vững nhất là",["dùng bình nước cá nhân, phân loại rác, tổ chức tái chế","phát thêm chai nhựa","đốt rác nhựa","chôn rác dưới sân"],1);
T("Phát triển bền vững gồm:",["+Phát triển kinh tế.","+Bảo đảm công bằng xã hội.","+Bảo vệ môi trường.","-Chỉ cần phát triển kinh tế là đủ."],1);

VL("d30");
M("Khi điều tra cách người dân địa phương sử dụng nước, câu hỏi phỏng vấn phù hợp nhất là",["Gia đình bác dùng nước từ nguồn nào và có tiết kiệm nước không?","Bác bao nhiêu tuổi?","Nhà bác có mấy con mèo?","Bác thích màu gì?"],1);
V("Ở quê em, nhiều ao hồ bị lấp để xây nhà. Hậu quả có thể là",["giảm khả năng thoát nước, dễ ngập úng khi mưa lớn","không có hậu quả","tăng nguồn nước sạch","giảm nhiệt độ"],1);

/* ---- KHTN ---- */
VL("k15");
M("Nước muối sinh lí, nước chè, sữa lắc, nước đường. Hỗn hợp nào là dung dịch trong suốt, đồng nhất?",["Nước muối sinh lí và nước đường","Sữa lắc","Nước chè có bã","Tất cả đều không phải"],1);
S("Hòa tan 20 g muối vào 180 g nước. Khối lượng dung dịch nước muối là bao nhiêu gam?","200",1);
T("Về dung dịch, huyền phù, nhũ tương:",["+Sữa là một dạng nhũ tương.","+Nước phù sa để lâu có lớp cặn lắng là huyền phù.","-Dầu ăn tan tốt trong nước tạo dung dịch.","+Khuấy, đun nóng giúp chất rắn tan nhanh hơn."],1);

VL("k16");
M("Hỗn hợp gồm cát, muối ăn và nước. Cách tách để thu được muối ăn tinh khiết là",["lọc bỏ cát, rồi cô cạn nước lọc để thu muối","chỉ cô cạn","chỉ lọc","dùng nam châm"],1);
V("Người dân vùng ven biển làm muối bằng cách dẫn nước biển vào ruộng, để nắng làm bay hơi. Đây là phương pháp",["cô cạn (bay hơi)","lọc","chiết","chưng cất"],1);
T("Chọn phương pháp tách phù hợp:",["+Tách bã chè ra khỏi nước chè: lọc.","+Tách dầu hỏa ra khỏi nước: chiết.","-Tách đường ra khỏi nước đường: lọc.","+Tách mạt sắt khỏi bột gỗ: dùng nam châm."],1);

VL("k17");

VL("k28");

VL("k31");

VL("k33");

VL("k34");

VL("k37");

VL("k38");

VL("k39");

VL("k40");

const fresh = () => ({ v: 2, q: {}, hist: [], pr: {}, done: {}, hk: 1, learned: {} });

function merge(a, b) {
  const out = fresh();
  const seen = new Set();
  [...(a.hist || []), ...(b.hist || [])].forEach((h) => { if (!seen.has(h.t)) { seen.add(h.t); out.hist.push(h); } });
  out.hist.sort((x, y) => x.t - y.t);
  out.hist = out.hist.slice(-500);
  const aq = a.q || {}, bq = b.q || {};
  new Set([...Object.keys(aq), ...Object.keys(bq)]).forEach((id) => {
    const x = aq[id], y = bq[id];
    out.q[id] = !x ? y : !y ? x : (y.n > x.n || (y.n === x.n && y.l > x.l)) ? y : x;
  });
  const ap = a.pr || {}, bp = b.pr || {};
  Object.keys({ ...ap, ...bp }).forEach((k) => (out.pr[k] = Math.max(ap[k] || 0, bp[k] || 0)));
  const ad = a.done || {}, bd = b.done || {};
  Object.keys({ ...ad, ...bd }).forEach((k) => (out.done[k] = Math.max(ad[k] || 0, bd[k] || 0)));
  out.hk = b.hk || a.hk || 1;
  const al = a.learned || {}, bl = b.learned || {};
  out.learned = { ...al, ...bl };
  if (a.learnedAt > (b.learnedAt || 0)) out.learned = { ...bl, ...al };
  out.learnedAt = Math.max(a.learnedAt || 0, b.learnedAt || 0);
  return out;
}

function submit() {
  const s = session;
  const res = s.qs.map((q, i) => gradeOne(q, s.ans[i]));
  const pts = res.reduce((n, r) => n + r.pts, 0);
  let sc = Math.round((pts / s.qs.length) * 100) / 10;
  s.tn = null;
  if (s.weights) { // điểm trắc nghiệm theo trọng số (VD Tin học: chọn đáp án 0,25đ, đúng – sai 1đ, tổng 7đ)
    const tn = s.qs.reduce((n, q, i) => n + (s.weights[q.t] || 0) * (q.t === "tf" && s.tfLinear ? res[i].k / 4 : res[i].pts), 0);
    const mx = s.qs.reduce((n, q) => n + (s.weights[q.t] || 0), 0);
    s.tn = Math.round(tn * 100) / 100; s.tnMax = mx;
    sc = Math.round((tn / mx) * 100) / 10;
  }
  const attemptNo = store.hist.length + 1;
  s.qs.forEach((q, i) => {
    const st = store.q[q.id] || { n: 0, w: 0, b: -1, l: 0 };
    st.n++; st.l = attemptNo;
    if (!res[i].ok) { st.w++; st.b = 0; } else st.b = st.b === -1 ? 3 : Math.min(3, st.b + 1);
    store.q[q.id] = st;
  });
  const wrongIds = s.qs.filter((q, i) => !res[i].ok).map((q) => q.id);
  const entry = { t: Date.now(), m: s.mode, s: s.subj, sc, k: res.filter((r) => r.ok).length, tot: s.qs.length, w: wrongIds, d: Math.round((Date.now() - s.start) / 1000) };
  if (s.les) entry.les = s.les;
  if (s.pick) entry.pick = s.pick.length;
  if (s.set) { entry.set = s.set; entry.setSubj = s.subj; if (s.essayAns) { entry.es = s.essayAns.map((t) => t.slice(0, 1500)); const per = (s.essayPts || 3) / s.essays.length; entry.esc = q4(s.essays.reduce((n, e, k) => n + per * gradeEssay(e, s.essayAns[k]).frac, 0)); entry.esMax = s.essayPts || 3; s.esc0 = entry.esc; entry.tnp = Math.round((s.tn != null ? s.tn * (s.tnPts || 7) / s.tnMax : sc * (s.tnPts || 7) / 10) * 100) / 100; } if (s.exam) entry.dur = Math.round(Math.min(exMin(s) * 60000, exMin(s) * 60000 - Math.max(0, (s.paused != null ? s.paused : s.deadline - nowMs()))) / 1000); }
  store.hist.push(entry); s.histT = entry.t;

    const before = store.done[s.les] || 0;
    if (sc > before) store.done[s.les] = sc;
    s.newlyDone = before < PASS && sc >= PASS;
  }
  save();
  s.res = res; s.sc = sc;
  renderResult();
}

function ansText(q, a) {

    };

    upd();

  }

  $("#btn-home").onclick = () => { session = null; renderHome(); window.scrollTo(0, 0); };

}

/* ================= CHẤM TỰ LUẬN TỰ ĐỘNG (so ý trong bài làm với đáp án) ================= */
const ES_STOP = new Set("va la cua co cac nhung mot de cho khi thi voi duoc nhu nen vi o trong tu the nao gi em ta con nay do day kia rat cung da dang se bi ra vao len xuong lai moi hay hoac neu ma thuoc tren duoi sau truoc giua theo bang ve nhieu it hon nhat can phai biet minh ho chung toi ban khong chua roi".split(" "));
const esNorm = (t) => plain(String(t).toLowerCase()).replace(/(\d)[\s.](?=\d{3}\b)/g, "$1").replace(/(\d)[\s.](?=\d{3}\b)/g, "$1").replace(/(\d),(\d)/g, "$1.$2").replace(/(\d)([a-z])/g, "$1 $2").replace(/([a-z])(\d)/g, "$1 $2");
const esToks = (t) => esNorm(t).split(/[^a-z0-9.]+/).map((w) => w.replace(/^\.+|\.+$/g, "")).filter(Boolean);
const isNum = (w) => /^\d+(\.\d+)?$/.test(w);
function gradeIdea(idea, ans, qToks) {
  const it = esToks(idea), at = esToks(ans);
  if (!at.length) return 0;
  const aset = new Set(at), abig = new Set(at.slice(1).map((w, i) => at[i] + " " + w));
  const content = [...new Set(it.filter((w) => !ES_STOP.has(w) && !isNum(w) && w.length > 1))];
  let tw = 0, mw = 0; content.forEach((w) => { const wt = qToks.has(w) ? 0.4 : 1; tw += wt; if (aset.has(w)) mw += wt; });
  const uni = tw ? mw / tw : 0;
  const big = [...new Set(it.slice(1).map((w, i) => [it[i], w]).filter(([a, b]) => !(ES_STOP.has(a) && ES_STOP.has(b)) && !isNum(a) && !isNum(b)).map(([a, b]) => a + " " + b))];
  const bi = big.length ? big.filter((x) => abig.has(x)).length / big.length : uni;
  let sc = Math.max(uni, 0.6 * uni + 0.4 * bi);
  let nums = [...new Set(it.filter(isNum))];
  const fresh = nums.filter((n) => !qToks.has(n));
  if (fresh.length) nums = fresh; // số con tự tính ra mới là ý chính
  if (nums.length) { const nf = nums.filter((n) => aset.has(n)).length / nums.length; sc = tw ? 0.35 * sc + 0.65 * nf : nf; if (fresh.length && nf === 0) sc = Math.min(sc, 0.2); }
  return sc >= 0.4 ? 1 : sc >= 0.22 ? 0.5 : 0;
}
const esFlat = (t) => " " + esNorm(t).replace(/[^a-z0-9.]+/g, " ").replace(/\.(?![0-9])/g, " ").replace(/\s+/g, " ").trim() + " ";
const KEY_RE = {};
function keyIdea(spec, flat) {
  const groups = spec.split(";").map((g) => g.split("|").map((k) => esFlat(k).trim()).filter(Boolean)).filter((g) => g.length);
  const hit = groups.filter((g) => g.some((k) => { const re = KEY_RE[k] || (KEY_RE[k] = new RegExp(" " + k.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + (/[0-9]$/.test(k) ? "(?![0-9])" : ""))); return re.test(flat); })).length;
  const f = groups.length ? hit / groups.length : 0;
  return f >= 0.6 ? 1 : f >= 0.3 ? 0.5 : 0;
}
function gradeEssay(e, ans) {
  const qToks = new Set(esToks(e.q));
  const keys = typeof ESSAY_KEYS !== "undefined" && ESSAY_KEYS[e.id];
  const flat = esFlat(ans || "");
  const marks = e.ideas.map((t, j) => !String(ans || "").trim() ? 0 : keys && keys[j] ? keyIdea(keys[j], flat) : gradeIdea(t, ans || "", qToks));
  let frac = marks.reduce((a, b) => a + b, 0) / e.ideas.length, copied = false;
  const at = esToks(ans || "").filter((w) => !ES_STOP.has(w));
  const qLen = esToks(e.q).filter((w) => !ES_STOP.has(w)).length;
  if (at.length >= 8 && at.length >= 0.6 * qLen && at.filter((w) => qToks.has(w)).length / at.length > 0.85) { frac *= 0.5; copied = true; } // chủ yếu chép lại đề
  return { marks, frac, copied };
}
const q4 = (x) => Math.round(x * 4) / 4;
const scoreOf = (h) => (h.tnp != null && h.esc != null ? Math.round((h.tnp + h.esc) * 100) / 100 : h.sc);
const fmt2 = (x) => (Math.round(x * 100) / 100).toLocaleString("vi-VN", { maximumFractionDigits: 2 });

  });
  if (essays.length) {
    body += para("II. TỰ LUẬN (" + (DC_SETS[subj][setNo - 1].essayPts || 3) + " điểm)", { b: 1, before: 160, keep: 1 });
    essays.forEach((e, k) => {
      const lines = e.q.split("\n");
      body += para([["Câu " + (k + 1) + " (" + fmt1((DC_SETS[subj][setNo - 1].essayPts || 3) / essays.length) + " điểm). ", true], [lines[0], false]], { before: 60 });
      lines.slice(1).forEach((ln) => (body += para(ln, { ind: 360 })));
      for (let r = 0; r < 6; r++) body += para("………………………………………………………………………………………………………………");
    });
  }
  body += pageBreak + para("ĐÁP ÁN – Đề số " + no, { b: 1, center: 1, after: 120 });
  if (essays.length) body += para("I. Trắc nghiệm", { b: 1, before: 60 });
  keyLines.forEach((k) => (body += para(k)));
  if (essays.length) {
    body += para("II. Tự luận – gợi ý trả lời", { b: 1, before: 120 });
    essays.forEach((e, k) => { body += para("Câu " + (k + 1) + ":", { b: 1, before: 60 }); e.ideas.forEach((t) => (body += para("– " + t, { ind: 360 }))); });
  }
  const doc = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:body>${body}<w:sectPr><w:pgSz w:w="11906" w:h="16838"/><w:pgMar w:top="1134" w:right="1134" w:bottom="1134" w:left="1418" w:header="567" w:footer="567" w:gutter="0"/></w:sectPr></w:body></w:document>`;
  try {
    if (typeof JSZip === "undefined") throw { code: "nozip" };
    const dl = window.claude && window.claude.use ? await window.claude.use("downloads") : null;
    if (!dl) { toast("Chỗ đang mở trang này không tải tệp được. Hãy mở trang trên claude.ai để tải đề."); return; }
    const zip = new JSZip();
    zip.file("[Content_Types].xml", '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/><Override PartName="/word/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.styles+xml"/></Types>');
    zip.file("_rels/.rels", '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>');
    zip.file("word/_rels/document.xml.rels", '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>');
    zip.file("word/styles.xml", '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:styles xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:docDefaults><w:rPrDefault><w:rPr><w:rFonts w:ascii="Times New Roman" w:hAnsi="Times New Roman" w:cs="Times New Roman" w:eastAsia="Times New Roman"/><w:sz w:val="26"/><w:szCs w:val="26"/><w:lang w:val="vi-VN"/></w:rPr></w:rPrDefault></w:docDefaults></w:styles>');
    zip.file("word/document.xml", doc);
    const blob = await zip.generateAsync({ type: "blob" });
    const base = setNo ? (subj === "ls" ? "Su-Dia" : "GDCD") + "-De-cuong-giua-ki" : mode === "bai" ? SUBJECTS[subj].short + "-" + lesShort(LES[lesId]) : SUBJECTS[subj].short + "-" + MODES[mode].name;
    const fname = plain(base).replace(/[^A-Za-z0-9]+/g, "-").replace(/^-|-$/g, "") + "-de-" + no + ".docx";
    await dl.save({ filename: fname, data: blob });
    if (!setNo) store.pr[key] = no;
    qs.forEach((q) => { const st = store.q[q.id] || { n: 0, w: 0, b: -1, l: 0 }; st.n++; st.l = store.hist.length; store.q[q.id] = st; });
    save();
    toast("Đã tải Đề số " + no + ". Mở bằng Word để in.");
  } catch (e) {
    if (e && e.code === "declined") return;
    if (e && e.code === "rate_limited") { toast("Đang có một tệp chờ xác nhận. Thử lại sau giây lát."); return; }
    toast("Chưa tải được đề. Thử lại sau nhé.");
  }
}

/* ================= HIỆU ỨNG ================= */
function confetti() {
  if (reduceMotion()) return;
  const cv = document.createElement("canvas");
  cv.className = "confetti"; document.body.appendChild(cv);
  const ctx = cv.getContext("2d");
  const w = (cv.width = innerWidth), h = (cv.height = innerHeight);
  const cols = ["#F6B73C", "#E2683C", "#2BAE7E", "#8A63E8", "#E2537D", "#3A86E8"];
  const ps = Array.from({ length: 120 }, () => ({ x: w / 2 + (Math.random() - 0.5) * 120, y: h * 0.35, vx: (Math.random() - 0.5) * 12, vy: -Math.random() * 12 - 4, r: Math.random() * 6 + 4, c: cols[(Math.random() * cols.length) | 0], a: Math.random() * 6 }));
  let f = 0;
  (function tick() {
    ctx.clearRect(0, 0, w, h);
    ps.forEach((p) => { p.vy += 0.35; p.x += p.vx; p.y += p.vy; p.a += 0.2; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.a); ctx.fillStyle = p.c; ctx.fillRect(-p.r / 2, -p.r / 4, p.r, p.r / 2); ctx.restore(); });
    if (++f < 110) requestAnimationFrame(tick); else cv.remove();
  })();
}

/* ================= KHỞI ĐỘNG ================= */
renderHome();
initCloud();
initSheetReader();
requestAnimationFrame(tick);
