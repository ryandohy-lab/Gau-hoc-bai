<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gấu học bài">
<meta name="theme-color" content="#F5B83D">
<link rel="icon" href="icon.svg"><link rel="apple-touch-icon" href="icon.png">
</head><body>
<title>Học bài đi - Gấu thối</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap">
<style>
/* Layout: một cột trên nền "vở ô li", thẻ trắng nổi như trang giấy; nút to, bo tròn, có bóng đáy như nút trò chơi. */
:root {
  --bg: #F6F8FD; --grid: #E2E8F6; --grid-b: #C9D3EE; --margin: #F2A7A7;
  --surface: #FFFFFF; --ink: #1B2650; --muted: #5B6585; --line: #E3E7F2;
  --accent: #F6B73C; --accent-ink: #B9721A; --accent-soft: rgba(246,183,60,.22);
  --good: #1E9E6A; --bad: #D9483B; --good-soft: #E3F6EE; --bad-soft: #FCE9E6;
  --c-ls: #E2683C; --c-kh: #1E9E6A; --c-cn: #7B57E0; --c-gd: #D9467A; --c-th: #2F78E0;
  --shadow: 0 1px 0 rgba(27,38,80,.06), 0 8px 24px -12px rgba(27,38,80,.25);
  --f-display: "Baloo 2", "Be Vietnam Pro", system-ui, sans-serif;
  --f-body: "Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #121834; --grid: #1A2246; --grid-b: #232D5A; --margin: #6B3550;
  --surface: #1B2347; --ink: #EEF1FB; --muted: #A6AFCF; --line: #2C3762;
  --accent: #F6B73C; --accent-ink: #F8C766; --accent-soft: rgba(246,183,60,.18);
  --good: #4CCB95; --bad: #FF7A6B; --good-soft: rgba(76,203,149,.14); --bad-soft: rgba(255,122,107,.14);
  --c-ls: #F07E52; --c-kh: #3BB985; --c-cn: #9677F0; --c-gd: #EC6494; --c-th: #5A97F0;
  --shadow: 0 1px 0 rgba(0,0,0,.3), 0 10px 26px -12px rgba(0,0,0,.6); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #121834; --grid: #1A2246; --grid-b: #232D5A; --margin: #6B3550;
  --surface: #1B2347; --ink: #EEF1FB; --muted: #A6AFCF; --line: #2C3762;
  --accent: #F6B73C; --accent-ink: #F8C766; --accent-soft: rgba(246,183,60,.18);
  --good: #4CCB95; --bad: #FF7A6B; --good-soft: rgba(76,203,149,.14); --bad-soft: rgba(255,122,107,.14);
  --c-ls: #F07E52; --c-kh: #3BB985; --c-cn: #9677F0; --c-gd: #EC6494; --c-th: #5A97F0;
  --shadow: 0 1px 0 rgba(0,0,0,.3), 0 10px 26px -12px rgba(0,0,0,.6); color-scheme: dark; }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  background-color: var(--bg); color: var(--ink); font: 400 15px/1.55 var(--f-body);
  background-image:
    linear-gradient(var(--grid-b) 1px, transparent 1px),
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 100% 48px, 100% 12px, 48px 100%;
  min-height: 100vh;
}
#app { max-width: 760px; margin: 0 auto; padding-block: 20px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; gap: 18px; }
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
button:focus-visible, select:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
svg { display: block; }
h1, h2 { margin: 0; text-wrap: balance; }

/* Hero */
.hero { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center; }
.hero-text { min-width: 0; display: grid; gap: 10px; }
.eyebrow { margin: 0; font-size: 13px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.hero h1 { font: 800 clamp(25px, 5.4vw, 35px)/1.08 var(--f-display); }
.owl-wrap { width: clamp(96px, 22vw, 140px); }
.owl-wrap svg { width: 100%; height: auto; animation: bob 3.2s ease-in-out infinite; }
@keyframes bob { 50% { transform: translateY(-5px) rotate(-2deg); } }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px 5px 8px; border-radius: 99px; background: var(--surface); border: 1.5px solid var(--line); font-size: 14px; color: var(--muted); }
.chip b { color: var(--ink); font-variant-numeric: tabular-nums; }
.chip svg { width: 18px; height: 18px; }
.chip-fire svg { color: var(--c-ls); } .chip-star svg { color: var(--accent); } .chip svg { color: var(--good); }

/* Week strip */
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.wday { display: grid; justify-items: center; gap: 4px; font-size: 12px; color: var(--muted); font-weight: 600; }
.wday i { font-style: normal; width: 100%; max-width: 46px; aspect-ratio: 1; border-radius: 14px; display: grid; place-items: center; background: var(--surface); border: 1.5px dashed var(--grid-b); color: var(--muted); font-weight: 700; font-variant-numeric: tabular-nums; }
.wday.done i { background: var(--good); border: 0; color: #fff; }
.wday.done i svg { width: 20px; height: 20px; }
.wday.today span { color: var(--ink); }
.wday.today i { border-style: solid; border-color: var(--ink); }

/* Panels */
.panel { background: var(--surface); border-radius: 22px; padding: 20px; box-shadow: var(--shadow); display: grid; gap: 14px; min-width: 0;
  border-left: 3px solid var(--margin); }
.sec { font: 700 20px/1.2 var(--f-display); }
.modes { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.mode { text-align: left; display: grid; grid-template-columns: auto 1fr; grid-template-rows: auto auto; column-gap: 10px; align-items: center; padding: 12px; border-radius: 16px; border: 2px solid var(--line); background: var(--bg); transition: transform .12s, border-color .12s; }
.mode:hover { transform: translateY(-1px); border-color: var(--grid-b); }
.mode-ico { grid-row: span 1; width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: var(--surface); color: var(--ink); }
.mode-ico svg { width: 22px; height: 22px; }
.mode-name { font-weight: 700; line-height: 1.25; }
.mode-desc { font-size: 13px; color: var(--muted); line-height: 1.3; }
.mode.on { border-color: var(--ink); background: var(--surface); box-shadow: 0 3px 0 var(--ink); }
.mode.on .mode-ico { background: var(--accent); color: #1B2650; }
.subjects { display: flex; flex-wrap: wrap; gap: 8px; }
.subj { padding: 8px 13px; border-radius: 99px; border: 2px solid var(--sc); color: var(--ink); font-weight: 600; font-size: 14px; background: var(--surface); }
.subj.on { background: var(--sc); color: #fff; box-shadow: 0 3px 0 rgba(0,0,0,.18); }
.start-row { display: grid; gap: 8px; }
.btn-start { justify-self: start; display: inline-flex; align-items: center; gap: 10px; padding: 14px 26px; border-radius: 18px; background: var(--accent); color: #1B2650; font: 800 21px/1 var(--f-display); box-shadow: 0 5px 0 #C98A1B; transition: transform .08s, box-shadow .08s; }
.btn-start:active { transform: translateY(4px); box-shadow: 0 1px 0 #C98A1B; }
.btn-start svg { width: 22px; height: 22px; }
.hint { margin: 0; font-size: 14px; color: var(--muted); }
.tools { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.tool { display: flex; gap: 12px; align-items: center; text-align: left; padding: 14px; border-radius: 18px; background: var(--surface); box-shadow: var(--shadow); min-width: 0; }
.tool > svg { width: 28px; height: 28px; flex: none; color: var(--c-th); }
.tool span { display: grid; min-width: 0; } .tool small { color: var(--muted); font-size: 13px; }
.foot { margin: 0; display: flex; flex-wrap: wrap; gap: 10px 16px; justify-content: space-between; align-items: center; font-size: 13px; color: var(--muted); }
.sync::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); margin-right: 6px; }
.sync[data-kind="cloud"]::before { background: var(--good); }
.scope { display: inline-flex; gap: 8px; align-items: center; }
.scope select { font: inherit; color: var(--ink); background: var(--surface); border: 1.5px solid var(--line); border-radius: 10px; padding: 4px 8px; }
.btn-start:disabled, .tool:disabled { opacity: .45; cursor: default; box-shadow: none; transform: none; }
.mode-name .count { font-style: normal; font-size: 12px; font-weight: 700; padding: 1px 7px; border-radius: 99px; background: var(--accent-soft); color: var(--accent-ink); margin-left: 4px; white-space: nowrap; }
.sec-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
.hk { display: inline-flex; align-items: center; gap: 4px; font-size: 14px; color: var(--muted); font-weight: 600; }
.hk span { margin-right: 4px; }
.hk button { min-width: 42px; padding: 6px 12px; border-radius: 10px; border: 2px solid var(--line); background: var(--bg); font-weight: 800; font-family: var(--f-display); font-size: 16px; color: var(--ink); }
.hk button.on { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.les-group { display: grid; gap: 8px; }
.les-group h3 { margin: 6px 0 0; font: 700 15px/1.3 var(--f-body); color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.les-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.les { display: grid; grid-template-columns: 1fr auto; gap: 6px; align-items: stretch; }
.les-main { display: grid; grid-template-columns: 40px 1fr auto; gap: 12px; align-items: center; text-align: left; padding: 10px 12px; border-radius: 16px; border: 2px solid var(--line); background: var(--bg); min-width: 0; transition: border-color .12s, transform .1s; }
.les-main:hover { border-color: var(--sc); transform: translateY(-1px); }
.les-num { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: var(--surface); border: 2px solid var(--sc); color: var(--ink); font: 800 17px var(--f-display); font-variant-numeric: tabular-nums; }
.les-num svg { width: 20px; height: 20px; }
.les.ok .les-num { background: var(--good); border-color: var(--good); color: #fff; }
.les-title { min-width: 0; font-weight: 600; line-height: 1.35; display: grid; }
.les-title small { font-size: 12px; color: var(--muted); font-weight: 700; letter-spacing: .03em; }
.les-state { font-size: 12.5px; font-weight: 700; color: var(--muted); white-space: nowrap; }
.les.ok .les-state { color: var(--good); }
.les-print { width: 44px; border-radius: 14px; border: 2px solid var(--line); background: var(--surface); display: grid; place-items: center; color: var(--muted); }
.les-print svg { width: 20px; height: 20px; }
.les-print:hover { color: var(--ink); border-color: var(--grid-b); }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tagbox { font-size: 13px; font-weight: 700; padding: 4px 10px; border-radius: 10px; background: var(--good-soft); color: var(--good); }
.empty-box { margin: 0; padding: 14px 16px; border-radius: 14px; background: var(--accent-soft); font-size: 15px; }
.next-box { background: var(--surface); border-radius: 22px; padding: 18px 20px; box-shadow: var(--shadow); display: grid; gap: 12px; justify-items: start; border-left: 6px solid var(--accent); }
.next-box.ok { border-left-color: var(--good); }
.next-box p { margin: 0; font-size: 16px; }
.learned { display: grid; gap: 8px; padding: 12px 14px; border-radius: 14px; background: var(--bg); border: 1.5px dashed var(--grid-b); }
.learned .hint { margin: 0; }
.learned-row { display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: center; font-weight: 600; font-size: 14px; min-width: 0; }
.learned-row select { font: inherit; font-weight: 500; color: var(--ink); background: var(--surface); border: 1.5px solid var(--line); border-radius: 10px; padding: 8px 10px; min-width: 0; width: 100%; }
.tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 4px; border-radius: 14px; background: var(--bg); border: 1.5px solid var(--line); }
.tabs button { padding: 10px 8px; border-radius: 10px; font-weight: 700; font-size: 15px; color: var(--muted); }
.tabs button em { font-style: normal; font-size: 12px; padding: 1px 7px; border-radius: 99px; background: var(--line); color: var(--ink); margin-left: 4px; }
.tabs button.on { background: var(--surface); color: var(--ink); box-shadow: 0 2px 0 var(--line), 0 0 0 2px var(--sc) inset; }
.tabs button.on em { background: var(--sc); color: #fff; }
.pick-actions { display: flex; flex-wrap: wrap; gap: 8px; }
.pick-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 260px), 1fr)); gap: 8px; }
.pick { display: grid; grid-template-columns: 28px 1fr; gap: 10px; align-items: center; text-align: left; padding: 10px 12px; border-radius: 14px; border: 2px solid var(--line); background: var(--bg); min-width: 0; }
.pick-box { width: 28px; height: 28px; border-radius: 8px; border: 2px solid var(--grid-b); background: var(--surface); display: grid; place-items: center; color: #fff; }
.pick-box svg { width: 18px; height: 18px; }
.pick.on { border-color: var(--sc); background: var(--surface); }
.pick.on .pick-box { background: var(--sc); border-color: var(--sc); }
.pick-txt { min-width: 0; display: grid; font-weight: 600; font-size: 14.5px; line-height: 1.3; }
.pick-txt small { font-size: 12px; color: var(--muted); font-weight: 700; }
.sticky-start { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; display: flex; justify-content: center; padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px)); background: linear-gradient(to top, var(--bg) 70%, transparent); pointer-events: none; }
.sticky-start .btn-start { pointer-events: auto; justify-self: center; }
.pick-pad { height: 96px; }
.ghost:disabled { opacity: .45; cursor: default; }
.tabs.tabs3 { grid-template-columns: 1fr 1fr 1fr; }
.tabs.tabs3 button { font-size: 13.5px; padding: 9px 4px; }
.sets { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.set { display: grid; grid-template-columns: 1fr auto; gap: 6px; }
.set-main { display: grid; grid-template-columns: 44px 1fr auto; gap: 12px; align-items: center; text-align: left; padding: 12px; border-radius: 16px; border: 2px solid var(--line); background: var(--bg); min-width: 0; }
.set-main:hover { border-color: var(--sc); }
.set-no { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; background: var(--sc); color: #fff; font: 800 20px var(--f-display); }
.set-no svg { width: 22px; height: 22px; }
.set.ok .set-no { background: var(--good); }
.set-title { display: grid; min-width: 0; } .set-title b { font: 700 17px var(--f-display); } .set-title small { font-size: 13px; color: var(--muted); }
.essay-box { background: var(--surface); border-radius: 22px; padding: 20px; box-shadow: var(--shadow); display: grid; gap: 14px; border-left: 6px solid var(--c-gd); }
.essay-box .hint { margin: 0; }
.essay { display: grid; gap: 10px; padding: 14px; border-radius: 16px; background: var(--bg); border: 1.5px solid var(--line); justify-items: start; }
.essay-q { margin: 0; line-height: 1.55; }
.essay-q br + br { display: none; }
.essay textarea, #exam-essay { width: 100%; font: inherit; color: var(--ink); background: var(--surface); border: 1.5px solid var(--line); border-radius: 12px; padding: 10px 12px; resize: vertical; }
.essay-ideas { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; width: 100%; }
.essay-ideas label { display: grid; grid-template-columns: 22px 1fr; gap: 8px; align-items: start; padding: 8px 10px; border-radius: 10px; background: var(--good-soft); cursor: pointer; }
.essay-ideas input { width: 18px; height: 18px; margin-top: 2px; accent-color: var(--good); }
.essay-total { margin: 0; font-size: 15px; padding: 10px 14px; border-radius: 12px; background: var(--accent-soft); }
@media (max-width: 560px) { .set-main { grid-template-columns: 40px 1fr; } .set-main .les-state { grid-column: 2; } .set-no { width: 40px; height: 40px; } }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); margin: 0; background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 14px; font-size: 14px; max-width: calc(100% - 32px); box-shadow: var(--shadow); z-index: 20; }

/* Quiz */
.quiz { display: grid; gap: 14px; }
.qbar { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 10px; }
.qmeta { text-align: center; font-weight: 600; color: var(--muted); font-size: 14px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.qcount { font: 800 18px var(--f-display); font-variant-numeric: tabular-nums; }
.ghost { display: inline-flex; align-items: center; gap: 6px; padding: 9px 14px; border-radius: 12px; background: var(--surface); border: 1.5px solid var(--line); font-weight: 600; font-size: 15px; }
.ghost svg { width: 18px; height: 18px; } .ghost:disabled { opacity: .4; cursor: default; }
.progress { height: 12px; border-radius: 99px; background: var(--surface); border: 1.5px solid var(--line); overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--sc); border-radius: 99px; transition: width .3s; }
.qcard { background: var(--surface); border-radius: 22px; padding: clamp(16px, 4vw, 26px); box-shadow: var(--shadow); display: grid; gap: 16px; border-top: 6px solid var(--sc); min-width: 0; }
.qtags { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.tag { color: #fff; font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 99px; white-space: nowrap; }
.tag-type { font-size: 13px; color: var(--muted); font-weight: 600; }
.qtext { font: 600 clamp(17px, 3.9vw, 20px)/1.45 var(--f-body); }
.opts { display: grid; gap: 10px; }
.opt { display: grid; grid-template-columns: 34px 1fr; gap: 10px; align-items: center; text-align: left; padding: 12px 14px; border-radius: 16px; border: 2px solid var(--line); background: var(--bg); font-size: 15.5px; line-height: 1.45; transition: border-color .12s, transform .1s; }
.opt:hover { border-color: var(--sc); }
.opt b { width: 34px; height: 34px; border-radius: 11px; display: grid; place-items: center; background: var(--surface); border: 2px solid var(--line); font: 800 16px var(--f-display); }
.opt.on { border-color: var(--sc); background: var(--surface); box-shadow: 0 3px 0 var(--sc); }
.opt.on b { background: var(--sc); border-color: var(--sc); color: #fff; }
.tfs { display: grid; gap: 10px; }
.tf { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center; padding: 12px 14px; border-radius: 16px; background: var(--bg); border: 2px solid var(--line); }
.tf p { margin: 0; font-size: 15px; min-width: 0; }
.tf-btns { display: flex; gap: 6px; }
.tfb { min-width: 64px; padding: 9px 10px; border-radius: 12px; border: 2px solid var(--line); background: var(--surface); font-weight: 700; }
.tfb.on.yes { background: var(--good); border-color: var(--good); color: #fff; }
.tfb.on.no { background: var(--bad); border-color: var(--bad); color: #fff; }
.sa { display: grid; gap: 8px; font-weight: 600; }
.sa small { color: var(--muted); font-weight: 500; }
.sa input { font: 700 20px var(--f-display); padding: 12px 16px; border-radius: 16px; border: 2px solid var(--line); background: var(--bg); color: var(--ink); width: 100%; max-width: 360px; }
.sa input:focus { border-color: var(--sc); outline: none; box-shadow: 0 3px 0 var(--sc); }
.qnav { display: flex; justify-content: space-between; gap: 10px; }
.btn-next { display: inline-flex; align-items: center; gap: 8px; padding: 11px 20px; border-radius: 14px; background: var(--ink); color: var(--bg); font: 700 16px var(--f-display); box-shadow: 0 4px 0 var(--grid-b); }
.btn-next svg { width: 20px; height: 20px; }
.btn-submit { background: var(--good); color: #fff; box-shadow: 0 4px 0 color-mix(in srgb, var(--good) 60%, #000); }
.dots { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
.dot { width: 34px; height: 34px; border-radius: 10px; background: var(--surface); border: 1.5px solid var(--line); font-size: 13px; font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; }
.dot.done { background: var(--sc); color: #fff; border-color: var(--sc); }
.dot.cur { outline: 3px solid var(--ink); outline-offset: 1px; }
.dot { display: grid; place-items: center; width: 28px; height: 28px; font-size: 12px; border-radius: 8px; }
.dot.skipd { background: var(--bg); border-style: dashed; }
.fuse.exam .fuse-sec { width: 78px; }
.fuse.exam .fuse-sec b { font-size: 19px; }
.exam-nav { display: flex; justify-content: space-between; gap: 10px; }
.dots button.dot { cursor: pointer; padding: 0; }
.dot.dot-es { width: auto; padding: 0 8px; }
#exam-essay { font-size: 16px; margin-top: 6px; }
.exam-submit-row { text-align: center; margin: 10px 0 0; }

.empty { margin: 0; color: var(--muted); }
.confetti { position: fixed; inset: 0; pointer-events: none; z-index: 40; }

}

   IDEA(câu hỏi, [ĐÚNG, sai, sai, sai])                                   — câu "ý tưởng tự luận"

/* --- Bài 1. Tự hào về truyền thống gia đình, dòng họ --- */
VL("g1");
DC("Ý nào dưới đây thể hiện ý nghĩa của việc giữ gìn và phát huy truyền thống tốt đẹp của gia đình, dòng họ?",["Có thêm kinh nghiệm.","Có thêm tiền tiết kiệm.","Có rất nhiều bạn bè.","Không phải lo về việc làm."],0);
DC("Để giữ gìn truyền thống của gia đình và dòng họ thì chúng ta cần làm gì?",["Sống lương thiện, hòa nhập với mọi người.","Không làm gì sai trái.","Tự hào, biết ơn người đi trước.","Tất cả các ý trên."],3,1);
DC("Đâu không phải là truyền thống tốt đẹp của dân tộc ta?",["Truyền thống hiếu học.","Truyền thống mê tín dị đoan.","Truyền thống yêu nước.","Truyền thống nhân nghĩa."],1);
DC("Câu tục ngữ nào dưới đây khuyên chúng ta giữ truyền thống văn hóa tốt đẹp của gia đình, dòng họ?",["Có qua có lại mới toại lòng nhau.","Giấy rách phải giữ lấy lề.","Vung tay quá trán.","Qua cầu rút ván."],1);
DC("Hành vi nào dưới đây thể hiện sự giữ gìn và phát huy truyền thống tốt đẹp của gia đình, dòng họ?",["Tìm hiểu những nét đẹp về truyền thống gia đình.","Chỉ tập trung cho việc học, không cần quan tâm những việc khác của gia đình.","Tổ chức cúng bái linh đình vào những ngày giỗ của ông bà, tổ tiên.","Dòng họ là những gì xa vời, thuộc về quá khứ, không cần quan tâm lắm."],0);
DC("Việc làm của bạn nào dưới đây thể hiện sự giữ gìn và phát huy truyền thống tốt đẹp của gia đình, dòng họ?",["Tâm cho rằng gia đình, dòng họ mình không có truyền thống tốt đẹp nào.","Lan rất thích nghe cha mẹ kể về truyền thống trồng lúa nước của gia đình, dòng họ mình.","Bình chê nghề làm đồ gốm truyền thống của gia đình là vất vả, tầm thường.","Tuấn cho rằng dòng họ là những gì xa vời, không cần quan tâm lắm."],1);
DC("Em đồng ý với ý kiến nào dưới đây?",["Truyền thống gia đình là những gì đã lạc hậu, cần phải xóa bỏ.","Gia đình, dòng họ nghèo thì không có gì đáng tự hào.","Chỉ những dòng họ nổi tiếng mới có những truyền thống tốt đẹp.","Gia đình, dòng họ nào cũng có truyền thống tốt đẹp cần phát huy."],3);
DC("Câu ca dao “Học là học để hành. Vừa hành vừa học mới thành người khôn.” nói về truyền thống nào?",["Truyền thống cần cù lao động.","Truyền thống hiếu học.","Truyền thống tôn sư trọng đạo.","Truyền thống yêu nước."],1);
DC("Hành vi nào dưới đây không thể hiện sự giữ gìn và phát huy truyền thống tốt đẹp của gia đình, dòng họ?",["Dành thời gian thăm hỏi, chăm sóc ông bà, người cao tuổi trong gia đình.","Tìm hiểu những nét đẹp về truyền thống gia đình và dòng họ.","Trân trọng và tiếp nối những truyền thống tốt đẹp của gia đình.","Chỉ tập trung cho việc học, không cần quan tâm những việc khác của gia đình."],3);
DC("Gia đình T có truyền thống yêu nước. Ông của T là lão thành cách mạng, bố của T đang làm việc trong quân đội. T nỗ lực học tập để thi vào Học viện Lục quân, nối tiếp truyền thống gia đình. Việc làm của T thể hiện điều gì?",["Kế thừa truyền thống tốt đẹp của gia đình, dòng họ.","Phô trương cho mọi người biết về gia đình và dòng họ.","T muốn thể hiện cái tôi trước bạn bè và thầy cô.","T muốn thể hiện mình trước gia đình và dòng họ."],0);
DC("Một trong những truyền thống tốt đẹp của gia đình, dòng họ Việt Nam là",["Lười biếng","Hiếu học","Chạy theo xu hướng","Ỷ lại"],1);
DC("Tự hào về truyền thống gia đình, dòng họ góp phần làm phong phú thêm điều gì?",["Truyền thống, bản sắc dân tộc Việt Nam","Lịch sử thế giới","Văn hóa phương Tây","Đời sống vật chất của cá nhân"],0);
DC("Nhận định nào sau đây là ĐÚNG?",["Chỉ một vài gia đình Việt Nam mới có truyền thống hiếu học.","Việc giữ nghề truyền thống không được coi là truyền thống của dân tộc.","Nhiều gia đình Việt Nam có truyền thống yêu thương con người.","Hiểu biết về truyền thống gia đình làm mất đi bản sắc dân tộc."],2);
DC("Nhận định nào sau đây là SAI?",["Tự hào về truyền thống gia đình làm ta yếu đuối hơn trong cuộc sống.","Truyền thống gia đình góp phần làm phong phú bản sắc dân tộc.","Cần có những việc làm phù hợp với khả năng để phát huy truyền thống.","Yêu nước là một truyền thống tốt đẹp của nhiều dòng họ Việt Nam."],0);
DC("Gia đình, dòng họ Việt Nam có truyền thống tốt đẹp trong việc giữ gìn",["tài sản gia đình","của cải vật chất","bí mật gia đình","nghề truyền thống"],3);
IDEA("Truyền thống gia đình, dòng họ là gì? (ý dùng để mở đầu bài tự luận)",["Những giá trị tốt đẹp như đạo đức, lối sống, nghề nghiệp… được các thế hệ giữ gìn và truyền lại cho con cháu","Những đồ vật quý giá trong nhà","Số tiền ông bà để lại cho con cháu","Những bí mật chỉ người trong nhà mới biết"]);
IDEA("Ý nghĩa của việc tự hào, giữ gìn truyền thống gia đình, dòng họ là",["Giúp ta có thêm sức mạnh, kinh nghiệm để vững vàng trong cuộc sống và góp phần làm phong phú bản sắc dân tộc","Giúp ta giàu có nhanh","Giúp ta được khen thưởng","Giúp ta không phải học tập"]);
IDEA("Học sinh lớp 6 có thể làm gì để giữ gìn, phát huy truyền thống gia đình? (ý cho tự luận)",["Tìm hiểu, trân trọng truyền thống; chăm ngoan, học tốt; phụ giúp gia đình giữ gìn nghề truyền thống","Khoe khoang gia đình với bạn bè","Chờ lớn lên mới quan tâm","Chỉ cần học giỏi, không cần biết gì về gia đình"]);
IDEA("Tình huống: Tiến sinh ra trong dòng họ hiếu học, từ lớp 1 đến lớp 6 luôn chăm chỉ học tập và là học sinh xuất sắc. Ý trả lời đầy đủ nhất cho câu “Tiến đã giữ gìn, phát huy truyền thống như thế nào?” là",["Tiến tự hào về dòng họ, quyết tâm học giỏi, chăm chỉ học ở trường và ở nhà, nhiều năm liền đạt học sinh xuất sắc","Tiến kể cho bạn bè nghe dòng họ mình giỏi","Tiến chỉ cần dựa vào thành tích của dòng họ","Tiến không cần cố gắng vì dòng họ đã giỏi sẵn"]);
IDEA("Tình huống: Yến sinh ra trong gia đình làm nghề dệt chiếu cói. Yến đã giữ gìn nghề truyền thống bằng cách",["Tìm hiểu nghề qua lời kể của bố mẹ, phụ giúp và học dần cách dệt, quyết tâm theo nghề của gia đình","Chê nghề vất vả và bỏ đi nơi khác","Chỉ ngồi xem bố mẹ làm","Bán hết khung dệt của gia đình"]);
IDEA("Một bạn chê nghề làm gốm truyền thống của gia đình em là vất vả, tầm thường. Cách ứng xử phù hợp là",["Bình tĩnh giải thích giá trị của nghề và bày tỏ niềm tự hào về truyền thống gia đình","Cãi nhau với bạn","Đồng ý với bạn và xấu hổ về gia đình","Im lặng, từ đó không nhắc đến nghề của gia đình"]);
IDEA("Câu tục ngữ “Con hơn cha là nhà có phúc” có ý nghĩa gì khi nói về truyền thống gia đình?",["Thế hệ sau tiếp nối và phát huy, làm tốt hơn thế hệ trước là niềm vui của cả gia đình","Con cái phải giàu hơn cha mẹ","Con không cần nghe lời cha mẹ","Gia đình nào cũng giống nhau"]);

/* --- Bài 2. Yêu thương con người --- */
VL("g2");
DC("Lòng yêu thương con người xuất phát từ đâu?",["Xuất phát từ lòng chân thành, vô tư, trong sáng.","Xuất phát từ sự ban ơn.","Xuất phát từ lòng thương hại.","Xuất phát từ sự mong trả ơn."],0);
DC("Hành vi nào dưới đây là biểu hiện của lòng yêu thương con người?",["Giúp đỡ bạn chép bài trong giờ kiểm tra.","Thờ ơ, lảng tránh trước nỗi đau khổ của người khác.","Tha thứ cho những người đã có lỗi lầm để họ tiến bộ.","Ganh tị vì thấy bạn học giỏi hơn mình."],2);
DC("Yêu thương con người sẽ nhận được điều gì?",["Mọi người yêu quý và kính trọng.","Mọi người kính nể và sợ hãi.","Mọi người coi thường.","Mọi người xa lánh."],0);
DC("Câu ca dao, tục ngữ nào nói về yêu thương con người?",["Thương người như thể thương thân.","Có công mài sắt có ngày nên kim.","Có cứng mới đứng đầu gió.","Cây ngay không sợ chết đứng."],0);
DC("Biểu hiện trái với yêu thương con người là",["Nhỏ nhen, ích kỉ, thờ ơ trước khó khăn của người khác, vô cảm, vụ lợi, đánh đập, sỉ nhục người khác.","Quan tâm, giúp đỡ, thông cảm, sẻ chia, biết tha thứ, biết hi sinh vì người khác.","Các bạn hỗ trợ, giúp đỡ lẫn nhau trong học tập và rèn luyện.","Thầy cô động viên, dìu dắt, dạy bảo các em học sinh."],0);
DC("Bố mẹ cho em tiền ủng hộ người có hoàn cảnh khó khăn nhưng bạn rủ em dùng số tiền đó mua trà sữa, bánh kẹo. Em sẽ làm gì?",["Nghe lời bạn, mua bánh kẹo chia cho cả lớp để lần sau được rủ đi chơi.","Từ chối, không làm theo bạn và dùng số tiền đó để ủng hộ người có hoàn cảnh khó khăn.","Rủ các bạn khác góp thêm tiền để mua được nhiều bánh kẹo hơn.","Dùng một ít tiền mua trà sữa, còn lại để ủng hộ."],1);
DC("Câu tục ngữ “Lá lành đùm lá rách” nói đến điều gì?",["Siêng năng, kiên trì.","Tự tin.","Tự lập.","Yêu thương con người."],3);
DC("Trong các hành vi sau, hành vi nào không thể hiện yêu thương con người?",["Mẹ bạn X bị ốm, lớp đã tổ chức tới thăm hỏi mẹ X.","Cụ M ở một mình, mắt kém; N đi học về vào nấu cơm giúp cụ.","G bị tai nạn phải nghỉ học; lớp cử H chép và giảng bài cho G nhưng H không đồng ý vì G không phải bạn thân.","L luôn giúp đỡ hàng xóm xung quanh nhà, không ngại việc gì."],2);
DC("Đâu là việc làm thể hiện lòng yêu thương con người?",["Giúp người khác với mục đích sau này được trả ơn.","Biết tha thứ cho lỗi lầm của người khác khi họ đã sửa chữa.","Hạ thấp nhân phẩm của những người được giúp đỡ.","Có thái độ thành kiến với những người mắc lỗi lầm."],1);
DC("Lòng yêu thương con người có ý nghĩa như thế nào đối với chúng ta?",["Mang lại niềm vui, sự tin tưởng vào bản thân và cuộc sống.","Để sau này được người đó trả ơn.","Là cách thể hiện mình trước người khác.","Để đánh bóng tên tuổi, được mọi người khen ngợi."],0);
DC("Yêu thương con người là sự quan tâm, giúp đỡ, làm những điều tốt đẹp cho ai?",["Người khác","Chỉ riêng bản thân mình","Cấp trên của mình","Những người mang lại lợi ích cho mình"],0);
DC("Người biết yêu thương con người sẽ nhận được thái độ như thế nào từ những người xung quanh?",["Bị nghi ngờ và đề phòng","Bị mọi người xa lánh và ghét bỏ","Bị coi thường và khinh bỉ","Được mọi người yêu quý và kính trọng"],3);
DC("Tình yêu thương làm cho mối quan hệ giữa con người với con người trở nên như thế nào?",["Càng xa cách, lạnh nhạt","Thêm gần gũi, gắn bó","Đầy thù hằn, mâu thuẫn","Luôn căng thẳng, đối đầu"],1);
DC("Khi cần thiết, người có tình yêu thương con người có thể làm gì?",["Hi sinh quyền lợi của bản thân vì người khác","Bỏ mặc người khác để bảo vệ lợi ích cá nhân","Đổ lỗi cho người khác để trốn tránh trách nhiệm","Lợi dụng người khác để trục lợi"],0);
DC("Đâu là biểu hiện của tình yêu thương con người?",["Sự ganh ghét, đố kị","Sự thờ ơ, vô cảm","Sự đồng cảm, chia sẻ","Sự ích kỉ, hẹp hòi"],2);
IDEA("Yêu thương con người là gì? (ý dùng để mở đầu bài tự luận)",["Là quan tâm, giúp đỡ, làm những điều tốt đẹp cho người khác, nhất là khi họ gặp khó khăn","Là chỉ yêu thương người thân trong nhà","Là cho tiền người khác","Là làm theo mọi điều người khác muốn"]);
IDEA("Các biểu hiện của yêu thương con người gồm",["Quan tâm, chia sẻ, cảm thông, giúp đỡ, biết tha thứ và hi sinh vì người khác","Ganh tị, đố kị","Thờ ơ, vô cảm","Giúp đỡ để được trả ơn"]);
IDEA("Ý nghĩa của yêu thương con người (ý cho tự luận)",["Là truyền thống quý báu của dân tộc; giúp mọi người gắn bó, xã hội tốt đẹp hơn; người biết yêu thương được mọi người yêu quý","Giúp ta được nổi tiếng","Giúp ta có nhiều tiền","Giúp ta không phải học"]);
IDEA("Học sinh rèn luyện lòng yêu thương con người bằng những việc làm nào?",["Quan tâm người thân, giúp đỡ bạn gặp khó khăn, tham gia hoạt động thiện nguyện vừa sức","Chỉ lo cho bản thân","Trêu chọc bạn yếu hơn","Chờ người khác nhờ mới giúp"]);
IDEA("Điểm khác nhau giữa yêu thương và thương hại là",["Yêu thương xuất phát từ lòng chân thành và tôn trọng; thương hại là thương xót kèm thái độ coi thường","Hai điều này giống hệt nhau","Thương hại tốt hơn yêu thương","Yêu thương là cho tiền, thương hại là cho quà"]);
IDEA("Tình huống: Các bạn lớp 6 quyên góp sách vở, quần áo gửi các bạn vùng lũ. Nhận xét đúng nhất về việc làm này là",["Thể hiện lòng yêu thương, tinh thần “lá lành đùm lá rách”, đáng khen và nên học tập","Việc làm lãng phí","Chỉ để được khen","Không liên quan đến học sinh"]);
IDEA("Câu tục ngữ nào cùng ý nghĩa với “Lá lành đùm lá rách”?",["Một miếng khi đói bằng một gói khi no","Có công mài sắt, có ngày nên kim","Tích tiểu thành đại","Tốt gỗ hơn tốt nước sơn"]);

/* --- Bài 3. Siêng năng, kiên trì --- */
VL("g3");

ESSAY("e1","g1","Tiến sinh ra trong một gia đình, dòng họ có truyền thống hiếu học: từ bao đời nay đều có người học giỏi, đỗ đạt cao. Tự hào về dòng họ, Tiến quyết tâm phấn đấu học giỏi. Suốt từ lớp 1 đến lớp 6, Tiến luôn chăm chỉ học ở trường và ở nhà, năm nào cũng là học sinh xuất sắc. Tiến đã biết giữ gìn, phát huy truyền thống của gia đình, dòng họ mình như thế nào?",["Tiến tự hào về truyền thống hiếu học của gia đình, dòng họ.","Tiến quyết tâm phấn đấu học giỏi để tiếp bước truyền thống.","Tiến chăm chỉ học tập ở trường và ở nhà suốt từ lớp 1 đến lớp 6.","Kết quả: năm nào Tiến cũng là học sinh xuất sắc – đó là cách giữ gìn, phát huy truyền thống bằng việc làm phù hợp với lứa tuổi.","Bài học cho em: tìm hiểu truyền thống gia đình mình và cố gắng học tập, rèn luyện để tiếp nối."]);
ESSAY("e2","g1","Yến sinh ra trong một gia đình làm nghề dệt chiếu cói truyền thống. Đời cụ, đời ông, đời bố và các cô, chú, bác đều theo nghề. Tự hào về nghề của gia đình, Yến thường hỏi bố mẹ để tìm hiểu về nghề; khi có thời gian, Yến phụ giúp bố mẹ và dần làm quen cách dệt; Yến học hỏi từng bước và quyết theo nghề của gia đình. Yến đã làm gì để giữ gìn nghề truyền thống của gia đình?",["Yến tự hào về nghề dệt chiếu cói truyền thống của gia đình.","Yến chủ động hỏi bố mẹ để tìm hiểu về nghề qua các đời.","Yến phụ giúp bố mẹ, làm quen và học dần cách dệt chiếu.","Yến quyết tâm theo nghề, tiếp nối truyền thống của gia đình.","Nhận xét: việc làm của Yến đáng khen, góp phần giữ gìn nghề truyền thống và bản sắc dân tộc."]);
ESSAY("e3","g3","Mai và Kiên nhận kết quả bài kiểm tra Toán. Mai được điểm thấp nên nói với Kiên: “Bài kiểm tra thấp thế này thì mẹ sẽ buồn và thất vọng về mình, mình sẽ giấu không nói cho mẹ biết, bạn thấy sao?”. Nếu là Kiên, em sẽ nói gì với Mai?",["Không đồng tình với việc giấu điểm, vì như vậy là thiếu trung thực, mẹ sẽ buồn hơn khi biết.","Khuyên Mai nói thật với mẹ và nhận ra thiếu sót của mình.","Cùng Mai tìm nguyên nhân điểm thấp (chưa chăm ôn bài, chưa hiểu bài…).","Khuyên Mai lập kế hoạch học tập, siêng năng và kiên trì luyện tập để cải thiện điểm.","Kiên có thể giúp Mai ôn bài; khi thấy Mai trung thực và cố gắng, mẹ sẽ vui và tin tưởng hơn."]);
ESSAY("e4","g2","Em hãy quan sát việc làm sau: Các bạn học sinh lớp 6 cùng nhau quyên góp sách vở, quần áo, tiền tiết kiệm để gửi tặng các bạn học sinh vùng bị lũ lụt. Em có suy nghĩ gì về việc làm của các bạn? Em sẽ làm gì?",["Việc làm của các bạn thể hiện lòng yêu thương con người, tinh thần “lá lành đùm lá rách”.","Việc làm giúp các bạn vùng lũ vượt qua khó khăn, sớm được đi học trở lại.","Đây là việc làm đáng khen, đáng học tập; giúp mọi người gắn bó với nhau hơn.","Em sẽ tham gia quyên góp vừa sức (sách vở, quần áo còn tốt, tiền tiết kiệm) và vận động bạn bè cùng tham gia."]);
ESSAY("e5","g1","Bạn Nam nói: “Nhà mình nghèo, chẳng có truyền thống gì để tự hào cả.” Em có đồng tình với ý kiến của Nam không? Vì sao? Em sẽ khuyên Nam điều gì?",["Không đồng tình với ý kiến của Nam.","Gia đình, dòng họ nào cũng có truyền thống tốt đẹp (cần cù lao động, hiếu thảo, yêu thương nhau, hiếu học…), không phụ thuộc giàu hay nghèo.","Truyền thống là giá trị tinh thần chứ không phải của cải vật chất.","Khuyên Nam hỏi ông bà, bố mẹ để tìm hiểu truyền thống gia đình, từ đó tự hào và phát huy bằng việc chăm ngoan, học tốt."]);
ESSAY("e6","g2","Lớp em có bạn H bị tật ở chân, đi lại khó khăn. Một số bạn trong lớp hay trêu chọc, bắt chước dáng đi của H. Em có đồng tình với việc làm của các bạn đó không? Nếu chứng kiến, em sẽ làm gì?",["Không đồng tình, vì trêu chọc người khuyết tật là thiếu tôn trọng, thiếu lòng yêu thương, làm bạn H tổn thương.","Khuyên các bạn dừng lại, đặt mình vào vị trí của H để cảm thông.","Động viên, giúp đỡ H trong học tập và đi lại (mang cặp, đưa bạn xuống sân…).","Nếu các bạn vẫn tiếp tục, báo với cô giáo chủ nhiệm để giúp đỡ.","Mọi người cần yêu thương, tôn trọng nhau, nhất là người gặp khó khăn."]);
ESSAY("e7","g2","Em hãy kể 2 – 3 việc làm thể hiện lòng yêu thương con người mà em đã làm hoặc sẽ làm. Những việc làm đó mang lại ý nghĩa gì?",["Ví dụ: chăm sóc ông bà, bố mẹ khi ốm; giảng bài cho bạn nghỉ học; nhường ghế cho người già trên xe buýt; quyên góp giúp người khó khăn.","Ý nghĩa với người được giúp: được quan tâm, vượt qua khó khăn.","Ý nghĩa với bản thân: thấy vui, được mọi người yêu quý, tin tưởng.","Ý nghĩa với xã hội: mọi người gắn bó hơn, xã hội tốt đẹp hơn."]);
ESSAY("e8","g3","Bạn K học Toán chưa tốt. Mỗi lần gặp bài khó, K thường bỏ qua và chờ bạn giải hộ để chép. Em có nhận xét gì về bạn K? Em sẽ khuyên K như thế nào?",["K chưa có đức tính siêng năng, kiên trì; K còn ngại khó, ỷ lại vào người khác.","Nếu cứ như vậy, K sẽ không hiểu bài, kết quả học tập ngày càng kém.","Khuyên K tự suy nghĩ trước, thử nhiều cách giải, xem lại kiến thức trong sách.","Khi chưa làm được thì hỏi thầy cô, bạn bè để được hướng dẫn chứ không chép bài.","Luyện tập đều đặn mỗi ngày, kiên trì thì sẽ tiến bộ."]);
ESSAY("e9","g3","Em hãy nêu ít nhất 3 việc em sẽ làm để rèn luyện đức tính siêng năng, kiên trì trong học tập và cuộc sống hằng ngày.",["Lập thời gian biểu và thực hiện đều đặn mỗi ngày.","Học bài và làm bài tập đầy đủ trước khi đến lớp.","Gặp bài khó không bỏ cuộc, tự suy nghĩ, tìm nhiều cách giải.","Tự giác làm việc nhà vừa sức (dọn phòng, rửa bát…).","Kiên trì với mục tiêu đã đặt ra (luyện chữ, tập thể thao, học thêm từ mới…)."]);
ESSAY("e10","g1","Em hãy kể về một truyền thống tốt đẹp của gia đình hoặc dòng họ em. Em đã và sẽ làm gì để giữ gìn, phát huy truyền thống đó?",["Giới thiệu truyền thống (ví dụ: hiếu học, cần cù lao động, nghề truyền thống, hiếu thảo với ông bà…).","Nêu biểu hiện cụ thể của truyền thống đó trong gia đình em.","Nêu cảm xúc: tự hào, biết ơn ông bà, cha mẹ.","Việc em làm: tìm hiểu về truyền thống, chăm ngoan học tốt, phụ giúp gia đình, kể cho bạn bè nghe.","Ý nghĩa: giúp em trưởng thành hơn, góp phần làm phong phú bản sắc dân tộc."]);

/* --- Chia 5 đề: mỗi đề 9 câu đề cương (3 câu/bài, cả 5 đề phủ đủ 45 câu) + câu ý tưởng + câu ôn trong kho = 20 câu trắc nghiệm, 2 câu tự luận --- */
const GD_GK_SETS = (() => {
  const by = (les, f) => BANK.filter((q) => q.les === les && f(q));
  const sets = [];
  const essays = [["e1", "e3"], ["e2", "e4"], ["e5", "e8"], ["e6", "e9"], ["e7", "e10"]];
  for (let d = 0; d < 5; d++) {
    const mc = [];
    ["g1", "g2", "g3"].forEach((les) => {
      const dc = by(les, (q) => q.src === "dc");
      [d, d + 5, d + 10].forEach((i) => dc[i] && mc.push(dc[i].id));
    });
    const ideas = ["g1", "g2", "g3"].map((les) => by(les, (q) => q.idea));
    const pickedIdeas = [];
    for (let k = 0; k < 7 && pickedIdeas.length < 5; k++) { const g = ideas[(d + k) % 3]; const q = g[(d + Math.floor(k / 3) * 2 + k) % g.length]; if (q && !pickedIdeas.includes(q.id)) pickedIdeas.push(q.id); }
    mc.push(...pickedIdeas);
    const extra = ["g1", "g2", "g3"].map((les) => by(les, (q) => !q.src && !q.idea));
    let k = 0;
    while (mc.length < 20 && k < 60) { const g = extra[k % 3]; const q = g[(d * 2 + Math.floor(k / 3)) % g.length]; if (q && !mc.includes(q.id)) mc.push(q.id); k++; }
    sets.push({ no: d + 1, mc, essays: essays[d] });
  }
  return sets;
})();
/* ===== ĐỀ CƯƠNG GIỮA KÌ I – LỊCH SỬ & ĐỊA LÍ 6 (THCS Nguyễn Du, năm học 2026 – 2027) =====
   Đáp án theo sách giáo khoa Kết nối tri thức (không theo bài làm trên đề cương). */
function DCT(q, st) { _push({ t: "tf", q, st: st.map((x) => [x.slice(1), x[0] === "+"]), src: "dc" }); }
function DCS(q, a, h) { const ans = a.split("|"); _push({ t: "sa", q, a: ans, h: h || "Ghi ngắn gọn", src: "dc" }); }

DCT("Đọc đoạn trích (SGK): “Ai Cập cổ đại nằm ở phía đông bắc châu Phi, hình thành dọc theo lưu vực sông Nin. Hằng năm, sông Nin bồi đắp phù sa, cung cấp nguồn nước, tạo điều kiện thuận lợi cho nông nghiệp phát triển. Lưỡng Hà nằm ở khu vực Tây Nam Á, giữa hai con sông Ti-grơ và Ơ-phơ-rát. Hai con sông cung cấp nước tưới tiêu, bồi đắp phù sa…”",["-a) Sông Ấn có vai trò to lớn đối với sự phát triển nền nông nghiệp Ai Cập cổ đại.","+b) Phù sa của sông Ti-grơ và Ơ-phơ-rát tạo điều kiện thuận lợi cho nông nghiệp Lưỡng Hà phát triển.","+c) Vị trí địa lí và các dòng sông lớn góp phần thúc đẩy sự hình thành các nền văn minh Ai Cập và Lưỡng Hà.","+d) Ai Cập cổ đại nằm ở phía đông bắc châu Phi."]);
DCT("Đọc đoạn trích: “Sông Nin có vai trò đặc biệt quan trọng đối với nền văn minh Ai Cập cổ đại. Hằng năm, nước sông dâng lên rồi rút xuống, để lại lớp phù sa màu mỡ. Người Ai Cập cổ đại đào kênh mương dẫn nước tưới tiêu, đồng thời sử dụng sông Nin làm tuyến đường giao thông, vận chuyển hàng hóa…”",["+a) Sông Nin bồi đắp phù sa, tạo điều kiện thuận lợi cho nông nghiệp Ai Cập cổ đại.","+b) Cư dân Ai Cập cổ đại sử dụng sông Nin làm tuyến đường giao thông.","-c) Nền văn minh Ai Cập cổ đại hình thành và phát triển không liên quan đến sông Nin.","+d) Người Ai Cập cổ đại đào kênh mương dẫn nước từ sông Nin vào đồng ruộng."]);

IDEA("Nguyên nhân sinh ra hiện tượng mùa (ý cho tự luận)",["Trục Trái Đất nghiêng và không đổi hướng khi chuyển động quanh Mặt Trời, nên hai nửa cầu lần lượt ngả về phía Mặt Trời","Do Trái Đất lúc gần lúc xa Mặt Trăng","Do Trái Đất tự quay nhanh, chậm khác nhau","Do gió mùa thổi"]);

/* Bổ sung: đúng – sai về Ai Cập và Lưỡng Hà cổ đại (dùng cho phần đúng – sai Lịch sử của các đề) */
VL("s7");
T("Về điều kiện tự nhiên của Ai Cập và Lưỡng Hà cổ đại:",["+Ai Cập cổ đại hình thành ở lưu vực sông Nin.","+Lưỡng Hà cổ đại nằm giữa hai con sông Ti-grơ và Ơ-phơ-rát.","-Ai Cập và Lưỡng Hà cổ đại đều nằm ở châu Âu.","+Đất phù sa màu mỡ ven sông giúp nông nghiệp ở hai nơi phát triển sớm."]);
T("Về nhà nước và xã hội Ai Cập, Lưỡng Hà cổ đại:",["+Người đứng đầu nhà nước Ai Cập cổ đại là Pha-ra-ông.","+Nông dân là lực lượng sản xuất chủ yếu trong xã hội.","-Nhà nước Ai Cập và Lưỡng Hà cổ đại là nhà nước dân chủ, mọi người đều bình đẳng.","+Vua nắm mọi quyền hành, đứng đầu bộ máy nhà nước."]);
T("Về thành tựu văn hóa của Ai Cập và Lưỡng Hà cổ đại:",["+Người Ai Cập cổ đại làm ra lịch, một năm có 365 ngày.","+Người Lưỡng Hà viết chữ hình nêm trên các tấm đất sét.","-Kim tự tháp là công trình kiến trúc của người Lưỡng Hà.","+Bộ luật Ha-mu-ra-bi là thành tựu của người Lưỡng Hà."]);
VL("s6");
IDEA("Công cụ kim loại đã làm thay đổi đời sống kinh tế của người nguyên thủy như thế nào? (ý cho tự luận)",["Khai hoang mở rộng đất trồng, nông nghiệp dùng cày và trồng lúa nước phát triển; thủ công nghiệp (luyện kim, làm gốm, dệt) ra đời; con người định cư lâu dài ven sông","Con người quay lại sống bằng săn bắt, hái lượm","Đời sống kinh tế không thay đổi","Con người bỏ nghề nông để đi du mục"]);
IDEA("Vì sao khi có sản phẩm dư thừa, xã hội nguyên thủy bị phân hóa? (ý cho tự luận)",["Người có chức phận (tộc trưởng, tù trưởng…) chiếm phần dư thừa làm của riêng, trở nên giàu có; số khác vẫn nghèo → xã hội phân hóa giàu, nghèo, xuất hiện giai cấp","Vì mọi người chia đều sản phẩm","Vì sản phẩm dư thừa bị vứt bỏ","Vì không ai còn lao động nữa"]);

ESSAY("ls1","s4","Kể tên những địa điểm tìm thấy dấu tích của Người tối cổ ở Đông Nam Á.",["Gia-va (In-đô-nê-xi-a).","Ở Việt Nam: hang Thẩm Khuyên, Thẩm Hai (Lạng Sơn), Núi Đọ (Thanh Hóa), An Khê (Gia Lai), Xuân Lộc (Đồng Nai).","Pôn-đoong (Mi-an-ma).","Ta-bon (Phi-líp-pin)…"]);
ESSAY("ls2","s4","Người tối cổ thường chọn địa bàn sinh sống như thế nào?",["Qua các dấu tích tìm thấy ở đảo Gia-va, hang Thẩm Khuyên (Lạng Sơn), một số địa điểm ở Thanh Hóa, Gia Lai…","Người tối cổ ở Đông Nam Á thường sinh sống trong hang động, mái đá tự nhiên.","Hoặc ở các vùng đồi gò ven sông, suối."]);
ESSAY("ls3","s4","Vì sao Người tối cổ thường sống trong hang động, mái đá hoặc ven sông, suối?",["Công cụ lao động còn thô sơ, chủ yếu là đá ghè đẽo.","Người tối cổ chưa thể xây dựng nhà ở ổn định.","Nên phải tận dụng hang động, mái đá tự nhiên làm nơi trú ẩn.","Để tránh thời tiết khắc nghiệt và thú dữ; ven sông, suối có nguồn nước và thức ăn."]);
ESSAY("ls4","s4","Vì sao nói Đông Nam Á là “cái nôi” xuất hiện con người?",["Dấu tích Người tối cổ phân bố rộng khắp từ vùng lục địa đến vùng hải đảo Đông Nam Á.","Chứng tỏ Đông Nam Á có môi trường sống rất lí tưởng cho con người thời nguyên thủy.","Môi trường tự nhiên thuận lợi cung cấp nguồn muông thú và cây trái (rau, củ, quả) vô cùng dồi dào.","Đáp ứng phương thức sống hái lượm và săn bắt phụ thuộc hoàn toàn vào tự nhiên của Người tối cổ."]);
ESSAY("kl1","s6","Trình bày vai trò của công cụ bằng kim loại đối với sự phát triển sản xuất, sự thay đổi đời sống kinh tế và quá trình phân hóa xã hội. Từ đó giải thích mối quan hệ giữa việc sử dụng công cụ bằng kim loại với sự chuyển biến từ xã hội nguyên thủy sang xã hội có giai cấp.",["Sản xuất: công cụ kim loại sắc bén, bền hơn đồ đá → năng suất lao động tăng, khai hoang mở rộng diện tích trồng trọt.","Đời sống kinh tế: nông nghiệp dùng cày, trồng lúa nước phát triển; thủ công nghiệp (luyện kim, làm gốm, dệt vải) ra đời; con người định cư ven sông.","Phân hóa xã hội: sản xuất phát triển → có sản phẩm dư thừa → một số người chiếm làm của riêng, trở nên giàu có; số khác nghèo → xã hội phân hóa giàu, nghèo.","Gia đình phụ hệ thay thế công xã thị tộc; quan hệ “cùng làm, cùng hưởng” bị phá vỡ.","Mối quan hệ: công cụ kim loại → sản phẩm dư thừa → tư hữu → phân hóa giàu nghèo → xã hội nguyên thủy tan rã, chuyển sang xã hội có giai cấp. Công cụ kim loại là nguyên nhân sâu xa của sự chuyển biến này."]);
ESSAY("kl2","s6","Sự xuất hiện của công cụ bằng kim loại đã làm thay đổi đời sống kinh tế của người nguyên thủy như thế nào?",["Công cụ kim loại (đồng, sau đó là sắt) cứng, sắc bén hơn đồ đá.","Con người khai hoang, mở rộng diện tích đất trồng trọt; nông nghiệp dùng cày, trồng lúa nước phát triển.","Chăn nuôi phát triển; thủ công nghiệp như luyện kim, làm gốm, dệt vải ra đời và chuyên môn hóa.","Con người chuyển xuống định cư ở vùng đồng bằng ven sông.","Năng suất tăng, lần đầu tiên có sản phẩm dư thừa."]);
ESSAY("kl3","s6","Vì sao khi công cụ bằng kim loại xuất hiện, xã hội nguyên thủy dần bị phân hóa giàu – nghèo?",["Công cụ kim loại giúp năng suất lao động tăng, sản xuất phát triển.","Lần đầu tiên con người làm ra sản phẩm dư thừa.","Những người có chức phận trong thị tộc, bộ lạc chiếm phần dư thừa làm của riêng, trở nên giàu có.","Số còn lại không có của dư thừa nên vẫn nghèo → xã hội phân hóa giàu, nghèo.","Gia đình phụ hệ dần thay thế công xã thị tộc; nguyên tắc “cùng làm, cùng hưởng” bị phá vỡ."]);
ESSAY("kl4","s6","Hãy giải thích mối quan hệ giữa việc sử dụng công cụ bằng kim loại và sự chuyển biến từ xã hội nguyên thủy sang xã hội có giai cấp.",["Công cụ kim loại ra đời → năng suất lao động tăng, sản xuất phát triển.","Sản xuất phát triển → xuất hiện sản phẩm dư thừa.","Sản phẩm dư thừa bị một số người chiếm làm của riêng → xuất hiện tư hữu.","Tư hữu dẫn đến xã hội phân hóa thành người giàu và người nghèo.","Xã hội nguyên thủy dần tan rã, con người bước sang xã hội có giai cấp → công cụ kim loại là nguyên nhân sâu xa của sự chuyển biến."]);
ESSAY("kl5","s6","Ở Việt Nam, người Việt cổ biết sử dụng kim loại từ khi nào? Công cụ kim loại đã tác động như thế nào đến xã hội nguyên thủy Việt Nam?",["Khoảng 4000 năm trước, cư dân văn hóa Phùng Nguyên đã biết chế tác công cụ bằng đồng đỏ, đồng thau; tiếp nối là Đồng Đậu, Gò Mun, rồi Đông Sơn (đồ sắt).","Công cụ kim loại giúp người Việt cổ khai phá vùng đồng bằng ven các con sông lớn (sông Hồng, sông Mã, sông Cả).","Nông nghiệp trồng lúa nước phát triển, thúc đẩy sản xuất, tạo ra sản phẩm dư thừa.","Xã hội bắt đầu phân hóa giàu, nghèo (thể hiện qua đồ tùy táng trong mộ táng khác nhau).","Đây là cơ sở cho sự ra đời của nhà nước đầu tiên của người Việt (Văn Lang)."]);
ESSAY("dl1","d7","Vì sao hướng chuyển động của gió, dòng biển và dòng sông bị lệch so với hướng ban đầu?",["Do Trái Đất tự quay quanh trục.","Các vật thể chuyển động trên bề mặt Trái Đất chịu tác động của lực Cô-ri-ô-lít nên bị lệch hướng so với hướng ban đầu.","Ở bán cầu Bắc, vật thể lệch về bên phải; ở bán cầu Nam, vật thể lệch về bên trái.","Hiện tượng này ảnh hưởng đến hướng chuyển động của gió, dòng biển và dòng sông."]);
ESSAY("dl2","d7","a) Ở bán cầu Nam, hướng gió chuyển động theo chiều kinh tuyến lệch theo hướng nào so với hướng ban đầu?  b) Vì sao hướng chuyển động của gió lại bị lệch so với hướng ban đầu?",["a) Ở bán cầu Nam, hướng gió lệch về bên trái so với hướng chuyển động ban đầu.","b) Do Trái Đất chuyển động tự quay quanh trục.","Chuyển động tự quay đã sinh ra một lực (lực Cô-ri-ô-lít) làm cho hướng chuyển động của gió theo chiều kinh tuyến bị lệch so với hướng ban đầu."]);
ESSAY("dl3","d7","Vì sao giờ ở các khu vực trên Trái Đất không giống nhau? Giờ quốc tế (GMT) có vai trò gì trong việc xác định giờ của các khu vực?",["Do Trái Đất có dạng hình cầu và tự quay quanh trục nên các khu vực trên Trái Đất có giờ khác nhau.","Bề mặt Trái Đất được chia thành 24 khu vực giờ.","Giờ GMT là giờ tại khu vực có kinh tuyến gốc (0°) đi qua, được lấy làm giờ quốc tế.","Giờ của các khu vực khác được tính dựa theo giờ khu vực số 0."]);
ESSAY("dl4","d3","Trên bản đồ tỉ lệ 1 : 500 000, khoảng cách giữa hai thành phố A và B đo được là 6 cm. Hãy tính khoảng cách thực tế giữa hai thành phố (đơn vị km) và nêu cách tính.",["Tỉ lệ 1 : 500 000 nghĩa là 1 cm trên bản đồ ứng với 500 000 cm ngoài thực tế.","Khoảng cách thực tế = khoảng cách trên bản đồ × mẫu số tỉ lệ = 6 × 500 000 = 3 000 000 cm.","Đổi đơn vị: 3 000 000 cm = 30 000 m = 30 km.","Kết luận: hai thành phố cách nhau 30 km."]);
ESSAY("dl5","d8","Trình bày nguyên nhân sinh ra hiện tượng mùa. Vì sao mùa ở hai bán cầu luôn trái ngược nhau?",["Trái Đất chuyển động quanh Mặt Trời với trục nghiêng và gần như không đổi hướng.","Hai bán cầu Bắc và Nam lần lượt ngả về phía Mặt Trời.","Bán cầu ngả về phía Mặt Trời nhiều hơn nhận nhiều nhiệt, ánh sáng hơn → mùa nóng; bán cầu ngả ít hơn → mùa lạnh.","Vì vậy cùng một thời điểm, mùa ở hai bán cầu trái ngược nhau (bán cầu Bắc mùa hạ thì bán cầu Nam mùa đông)."]);

ESSAY("kc2","d3","Trên bản đồ có tỉ lệ 1 : 200 000, khoảng cách giữa hai địa điểm A và B đo được là 4,5 cm. Hãy tính khoảng cách thực tế giữa A và B (đơn vị km).",["Tỉ lệ 1 : 200 000 nghĩa là 1 cm trên bản đồ ứng với 200 000 cm ngoài thực tế.","Khoảng cách thực tế = 4,5 × 200 000 = 900 000 cm.","Đổi đơn vị: 900 000 cm = 9 000 m = 9 km.","Kết luận: A cách B 9 km."]);
ESSAY("kc3","d3","Hai địa điểm M và N cách nhau 15 km ngoài thực tế. Trên bản đồ có tỉ lệ 1 : 300 000, khoảng cách giữa M và N là bao nhiêu xăng-ti-mét?",["Đổi khoảng cách thực tế ra cùng đơn vị cm: 15 km = 1 500 000 cm.","Khoảng cách trên bản đồ = khoảng cách thực tế : mẫu số tỉ lệ.","= 1 500 000 : 300 000 = 5 cm.","Kết luận: trên bản đồ, M và N cách nhau 5 cm."]);
ESSAY("kc4","d3","Trên bản đồ tỉ lệ 1 : 6 000 000, khoảng cách từ thành phố P đến thành phố Q đo được 11 cm. Tính khoảng cách thực tế giữa hai thành phố (km). Bản đồ này là bản đồ tỉ lệ lớn hay tỉ lệ nhỏ?",["Khoảng cách thực tế = 11 × 6 000 000 = 66 000 000 cm.","Đổi đơn vị: 66 000 000 cm = 660 000 m = 660 km.","Kết luận: P cách Q 660 km.","Mẫu số tỉ lệ rất lớn (6 000 000) nên đây là bản đồ tỉ lệ nhỏ, thể hiện ít chi tiết."]);
ESSAY("kc5","d3","Một bản đồ có tỉ lệ thước: 1 cm trên bản đồ ứng với 2 km ngoài thực tế. Khoảng cách giữa hai điểm trên bản đồ là 7,5 cm. a) Tính khoảng cách thực tế. b) Viết tỉ lệ số tương ứng của bản đồ.",["a) Khoảng cách thực tế = 7,5 × 2 = 15 km.","b) Đổi 2 km = 200 000 cm.","1 cm trên bản đồ ứng với 200 000 cm ngoài thực tế.","Vậy tỉ lệ số của bản đồ là 1 : 200 000."]);
/* --- 5 đề: mỗi đề 22 câu trắc nghiệm (Sử 11, Địa 11) + 4 câu tự luận (Sử đề cương, Sử công cụ kim loại, Địa đề cương, Địa tính khoảng cách) --- */
const LS_GK_SETS = (() => {
  const sLes = ["s4", "s5", "s6", "s7"], dLes = ["d1", "d2", "d3", "d4", "d6", "d7", "d8"];
  const of = (lesList, f) => BANK.filter((q) => lesList.includes(q.les) && f(q));
  const sDC = of(sLes, (q) => q.src === "dc" && q.t === "mc"), dDC = of(dLes, (q) => q.src === "dc" && q.t === "mc");
  const sTFdc = of(sLes, (q) => q.src === "dc" && q.t === "tf"), dTFdc = of(dLes, (q) => q.src === "dc" && q.t === "tf");
  const dSAdc = of(dLes, (q) => q.src === "dc" && q.t === "sa");
  const sIdea = of(sLes, (q) => q.idea), dIdea = of(dLes, (q) => q.idea);
  const sMC = of(sLes, (q) => !q.src && !q.idea && q.t === "mc"), dMC = of(dLes, (q) => !q.src && !q.idea && q.t === "mc");
  const sTF = of(["s7"], (q) => !q.src && q.t === "tf"), dTF = of(dLes, (q) => !q.src && q.t === "tf");
  const sSA = of(sLes, (q) => !q.src && q.t === "sa"), dSA = of(["d1", "d3", "d6", "d7", "d8"], (q) => !q.src && q.t === "sa");
  const pickN = (list, n, start, step, taken) => { const out = []; for (let k = 0; out.length < n && k < list.length * 3; k++) { const q = list[(start + k * step) % list.length]; if (q && !taken.has(q.id) && !out.includes(q.id)) out.push(q.id); } return out; };
  const sets = [];
  for (let d = 0; d < 5; d++) {
    const taken = new Set();
    const add = (ids) => ids.forEach((id) => { taken.add(id); mc.push(id); });
    const mc = [];
    add([d, d + 5, d + 10, d + 15].map((i) => sDC[i] && sDC[i].id).filter(Boolean));
    add(pickN(sMC, 3, d * 3, 7, taken));
    add(pickN(sIdea, 2, d * 2, 1, taken));
    add([d < 2 ? sTFdc[d].id : sTF[(d - 2) % sTF.length].id]);
    add(pickN(sSA, 1, d, 1, taken));
    add([d, d + 5, d + 10, d + 15].map((i) => dDC[i] && dDC[i].id).filter(Boolean));
    add(pickN(dMC, 3, d * 4, 11, taken));
    add(pickN(dIdea, 2, d * 2, 1, taken));
    add([d === 2 ? dTFdc[0].id : dTF[d % dTF.length].id]);
    add(d < 3 ? [dSAdc[d].id] : pickN(dSA, 1, d * 2, 1, taken));

  }
  return sets;
})();

ESSAY("th1","t1","Bạn Hà đo nhiệt độ cơ thể được 38,5°C. Mẹ thấy vậy liền cho Hà nghỉ học và đưa đi khám. Em hãy chỉ ra đâu là dữ liệu, đâu là thông tin trong tình huống trên, và thông tin đó đã giúp mẹ Hà như thế nào?",["Dữ liệu: con số 38,5°C đo được trên nhiệt kế.","Thông tin: Hà đang bị sốt (thân nhiệt cao hơn mức bình thường khoảng 37°C).","Thông tin giúp mẹ đưa ra quyết định: cho Hà nghỉ học, đưa đi khám kịp thời."]);
ESSAY("th3","t1","Trước chuyến dã ngoại, lớp em cần biết: thời tiết hôm đi, đường đến địa điểm và giờ xuất phát. Em sẽ thu nhận những thông tin đó từ đâu? Những thông tin đó giúp lớp em quyết định điều gì?",["Thời tiết: bản tin dự báo trên tivi, ứng dụng thời tiết, trang web dự báo.","Đường đi: bản đồ giấy hoặc ứng dụng bản đồ trên điện thoại.","Giờ xuất phát: thông báo của cô giáo chủ nhiệm, nhóm tin nhắn của lớp.","Thông tin giúp lớp quyết định: mang áo mưa hay mũ nón, chọn đường đi, có mặt đúng giờ."]);
ESSAY("th4","t2","Em dùng điện thoại chụp một bức ảnh rồi gửi cho bà qua tin nhắn. Hãy mô tả 4 hoạt động xử lí thông tin diễn ra trong tình huống này và bộ phận nào của điện thoại thực hiện.",["Thu nhận: camera của điện thoại thu nhận hình ảnh (thiết bị vào).","Xử lí: bộ xử lí của điện thoại biến đổi hình ảnh thành dãy bit, nén ảnh.","Lưu trữ: ảnh được lưu vào bộ nhớ của điện thoại.","Truyền: ảnh được gửi qua mạng đến điện thoại của bà và hiển thị trên màn hình (thiết bị ra)."]);
ESSAY("th5","t2","Máy bán nước tự động hoạt động như sau: khách bỏ tiền vào khe, bấm nút chọn loại nước; máy kiểm tra số tiền, rồi trả chai nước và tiền thừa, màn hình hiện “Cảm ơn quý khách”. Hãy chỉ ra thiết bị vào, bộ xử lí và thiết bị ra của máy.",["Thiết bị vào: khe nhận tiền, các nút bấm chọn loại nước.","Bộ xử lí: bộ phận kiểm tra số tiền, tính tiền thừa, ra lệnh trả nước.","Thiết bị ra: khay trả chai nước, khay trả tiền thừa, màn hình hiển thị lời cảm ơn.","Máy cũng có bộ nhớ lưu giá các loại nước và số lượng còn lại."]);
ESSAY("th6","t3","Cho một lưới ô vuông 3 hàng × 10 cột. Quy ước ô màu đen (■) biểu thị kí hiệu “1”, ô màu trắng (□) biểu thị kí hiệu “0”.\nHàng a: □ ■ □ ■ □ ■ □ ■ □ ■\nHàng b: ■ □ ■ □ ■ □ ■ □ ■ □\nHàng c: □ ■ □ ■ □ ■ □ ■ □ ■\na) Viết dãy bit biểu diễn cho mỗi hàng.\nb) Giải thích tại sao một byte không đủ để lưu trữ một hàng. Cần tối thiểu bao nhiêu byte để lưu trữ cả ba hàng?",["a) Hàng a: 0101010101; hàng b: 1010101010; hàng c: 0101010101.","b) Mỗi hàng có 10 ô → cần 10 bit; mà 1 byte = 8 bit < 10 bit nên một byte không đủ lưu một hàng.","Cả ba hàng có 3 × 10 = 30 bit.","30 : 8 = 3,75 → cần tối thiểu 4 byte để lưu trữ cả ba hàng (nếu lưu riêng từng hàng thì mỗi hàng 2 byte, cần 6 byte)."]);
ESSAY("th7","t3","Trong thư mục máy tính có hai tệp bài trình chiếu: “Bài 1” có dung lượng 17 028 KB và “Bài 2” có dung lượng 16 136 KB. Em hãy quy đổi dung lượng của các tệp này xấp xỉ ra MB. Nếu em soạn thêm nội dung vào bài trình chiếu thì dung lượng có thay đổi không? Vì sao?",["Vì 1 MB = 1024 KB nên muốn đổi KB ra MB ta chia cho 1024.","Bài 1: 17 028 : 1024 ≈ 16,6 MB (khoảng 17 MB).","Bài 2: 16 136 : 1024 ≈ 15,8 MB (khoảng 16 MB).","Khi soạn thêm nội dung, dung lượng tệp sẽ tăng lên, vì có thêm dữ liệu (chữ, hình ảnh…) cần được lưu trữ bằng nhiều bit hơn."]);
ESSAY("th8","t3","Một thẻ nhớ có dung lượng 2 GB đã dùng hết 1,5 GB. Mỗi bài hát có dung lượng 4 MB. Hỏi thẻ nhớ còn chứa được tối đa bao nhiêu bài hát? Trình bày cách tính.",["Dung lượng còn trống: 2 GB − 1,5 GB = 0,5 GB.","Đổi đơn vị: 0,5 GB = 0,5 × 1024 = 512 MB.","Số bài hát: 512 : 4 = 128 bài.","Kết luận: thẻ nhớ còn chứa được tối đa 128 bài hát."]);
ESSAY("th16","t3","Một chiếc USB có dung lượng 16 GB. Mỗi bức ảnh có dung lượng khoảng 8 MB. Hỏi USB chứa được tối đa bao nhiêu bức ảnh? Nếu mỗi ảnh được chụp với chất lượng cao hơn (dung lượng 16 MB) thì số ảnh thay đổi thế nào?",["Đổi đơn vị: 16 GB = 16 × 1024 = 16 384 MB.","Số ảnh 8 MB: 16 384 : 8 = 2048 bức ảnh.","Số ảnh 16 MB: 16 384 : 16 = 1024 bức ảnh.","Ảnh chất lượng cao chứa nhiều dữ liệu hơn nên dung lượng lớn hơn → USB chứa được ít ảnh hơn (giảm một nửa)."]);
ESSAY("th9","t4","Mạng điện thoại di động là một hệ thống viễn thông không dây cho phép các thiết bị di động (như điện thoại thông minh) kết nối và liên lạc với nhau trên một khu vực rộng lớn. Theo em, lợi ích chính của mạng này là gì?",["Giúp mọi người liên lạc (gọi điện, nhắn tin) mọi lúc, mọi nơi, kể cả khi đang di chuyển.","Không cần dây nối nên rất thuận tiện, phủ sóng trên khu vực rộng lớn.","Cho phép truy cập Internet trên điện thoại: tìm thông tin, học trực tuyến, gọi video.","Hỗ trợ kịp thời trong trường hợp khẩn cấp (gọi cấp cứu 115, cứu hỏa 114…)."]);
ESSAY("th10","t4","Lớp tin học có 10 máy tính nhưng chỉ có 1 máy in. Nếu các máy tính không được nối mạng thì việc in tài liệu gặp khó khăn gì? Khi nối mạng thì có lợi ích gì? Cần những thành phần nào để tạo mạng?",["Không có mạng: phải chép tài liệu sang USB rồi mang đến máy nối với máy in → mất thời gian, bất tiện.","Có mạng: mọi máy đều in được qua máy in dùng chung; có thể chia sẻ tài liệu giữa các máy.","Thành phần: thiết bị đầu cuối (10 máy tính, máy in).","Thiết bị kết nối (bộ chuyển mạch, dây cáp hoặc bộ phát Wi-Fi) và phần mềm mạng."]);
ESSAY("th11","t4","Nhà em muốn dùng Internet cho 1 máy tính để bàn đặt cố định ở phòng làm việc và 3 chiếc điện thoại thông minh. Em đề xuất dùng mạng có dây hay mạng không dây cho từng loại thiết bị? Vì sao?",["Máy tính để bàn: nên dùng mạng có dây (cáp mạng) vì máy đặt cố định, kết nối ổn định, nhanh.","Điện thoại: dùng mạng không dây (Wi-Fi) vì điện thoại hay di chuyển, không có cổng cắm dây.","Có thể dùng một bộ định tuyến vừa có cổng cắm dây, vừa phát Wi-Fi.","Cần đặt mật khẩu Wi-Fi để bảo vệ mạng gia đình."]);
ESSAY("th12","t5","Em cần tìm tư liệu cho bài thuyết trình “Bảo vệ môi trường”. Internet giúp em những gì? Em cần lưu ý gì khi sử dụng thông tin tìm được trên Internet?",["Internet giúp tìm kiếm nhanh bài viết, hình ảnh, video, số liệu về môi trường.","Có thể học hỏi, trao đổi với thầy cô, bạn bè qua thư điện tử, nhắn tin.","Lưu ý: chọn trang web tin cậy, đối chiếu nhiều nguồn vì thông tin trên Internet có thể sai.","Ghi rõ nguồn khi sử dụng hình ảnh, tư liệu; không sao chép nguyên văn."]);
ESSAY("th13","t5","Vì sao nói Internet có tính toàn cầu, tính tương tác và tính dễ tiếp cận? Lấy ví dụ cho mỗi đặc điểm.",["Toàn cầu: Internet kết nối máy tính ở khắp các quốc gia. Ví dụ: em có thể gọi video cho người thân ở nước ngoài.","Tương tác: người dùng có thể trao đổi, bình luận, phản hồi. Ví dụ: học trực tuyến, hỏi đáp với thầy cô.","Dễ tiếp cận: truy cập được ở nhiều nơi, nhiều lúc, trên nhiều thiết bị. Ví dụ: dùng điện thoại tra cứu thông tin khi đang ở ngoài đường.","Internet không thuộc quyền sở hữu của ai."]);
ESSAY("th14","t5","Một người lạ nhắn tin cho em qua mạng xã hội, hứa sẽ tặng quà nếu em gửi ảnh và địa chỉ nhà. Em sẽ xử lí tình huống này thế nào? Vì sao?",["Không trả lời, không gửi ảnh, địa chỉ hay bất kì thông tin cá nhân nào.","Báo ngay cho bố mẹ, thầy cô; có thể chặn tài khoản lạ đó.","Vì kẻ xấu có thể lợi dụng thông tin cá nhân để lừa đảo, bắt cóc hoặc làm hại em.","Internet có cả thông tin có ích và có hại, cần sử dụng an toàn, cảnh giác."]);
ESSAY("th15","t5","Bạn của em thường chơi trò chơi trực tuyến đến khuya nên hay đi học muộn và buồn ngủ trong lớp. Em hãy đưa ra lời khuyên cho bạn.",["Chỉ ra tác hại: thiếu ngủ, ảnh hưởng sức khỏe, mắt, kết quả học tập giảm sút.","Khuyên bạn đặt giới hạn thời gian chơi, không chơi vào buổi tối muộn.","Lập thời gian biểu cân đối giữa học tập, nghỉ ngơi và giải trí.","Thay bằng hoạt động lành mạnh (thể thao, đọc sách); nhờ bố mẹ giúp nếu khó tự điều chỉnh."]);

/* --- 5 đề Tin học --- */
const TH_GK_SETS = (() => {
  const les = ["t1", "t2", "t3", "t4", "t5"];
  const mcBy = les.map((l) => BANK.filter((q) => q.les === l && q.t === "mc"));
  const tfBy = les.map((l) => BANK.filter((q) => q.les === l && q.scen));
  const tfPlan = [[0, 1, 2, 3], [1, 2, 3, 4], [0, 2, 3, 4], [0, 1, 2, 4], [0, 1, 3, 4]];
  const tfIdx = [[0, 0, 0, 0], [1, 1, 1, 0], [1, 2, 2, 1], [2, 2, 3, 2], [3, 3, 3, 3]];
  const mcCount = [3, 2, 3, 2, 2];
  const essays = [["th1", "th6", "th9"], ["th4", "th7", "th12"], ["th3", "th10", "th8"], ["th5", "th16", "th14"], ["th11", "th13", "th15"]];
  const sets = [];
  for (let d = 0; d < 5; d++) {
    const mc = [];
    les.forEach((l, i) => {
      const list = mcBy[i], n = mcCount[(i + d) % 5];
      for (let k = 0, got = 0; got < n && k < list.length * 2; k++) { const q = list[(d * 3 + k * 2) % list.length]; if (!mc.includes(q.id)) { mc.push(q.id); got++; } }
    });
    const tf = tfPlan[d].map((li, j) => tfBy[li][tfIdx[d][j] % tfBy[li].length].id);
    sets.push({ no: d + 1, mc: mc.concat(tf), essays: essays[d], weights: { mc: 0.25, tf: 1, sa: 0.25 }, tfLinear: true });
  }
  return sets;
})();

ESSAY("cn1","c1","Nhà ở có vai trò gì đối với con người? Lấy ví dụ minh họa.",["Nhà ở là nơi trú ngụ, bảo vệ con người trước tác động xấu của thiên nhiên (nắng, mưa, gió, bão, lũ…).","Nhà ở là nơi đáp ứng nhu cầu sinh hoạt: nghỉ ngơi, ăn uống, học tập, vui chơi.","Nhà ở là nơi gắn kết các thành viên trong gia đình.","Ví dụ: mùa bão, ngôi nhà vững chắc giúp gia đình an toàn; buổi tối cả nhà quây quần ăn cơm."]);
ESSAY("cn2","c1","Vì sao ở vùng đồng bằng sông Cửu Long người dân thường làm nhà sàn, nhà nổi? Nhà ở vùng ven biển miền Trung thường có đặc điểm gì? Vì sao?",["Đồng bằng sông Cửu Long là vùng sông nước, hay ngập lụt.","Nhà sàn, nhà nổi giúp tránh ngập, thuận tiện cho sinh hoạt trên sông nước.","Ven biển miền Trung thường có nhà mái thấp, tường dày, vững chắc.","Vì miền Trung thường xuyên có bão, gió mạnh; nhà như vậy giúp chống chịu gió bão."]);
ESSAY("cn3","c1","Hãy mô tả các khu vực chính trong ngôi nhà của gia đình em và công dụng của mỗi khu vực.",["Nơi tiếp khách, sinh hoạt chung (phòng khách).","Nơi nghỉ ngơi (phòng ngủ); nơi học tập (góc học tập).","Nơi nấu ăn, ăn uống (bếp, phòng ăn).","Nơi vệ sinh, tắm giặt; nơi để đồ (kho), nơi thờ cúng… tùy từng gia đình."]);
ESSAY("cn4","c1","Em cần làm gì để giữ gìn nhà ở sạch sẽ, ngăn nắp? Nêu ít nhất 4 việc làm cụ thể.",["Gấp chăn màn, sắp xếp đồ dùng cá nhân gọn gàng sau khi dùng.","Quét nhà, lau bàn ghế, dọn dẹp góc học tập thường xuyên.","Phân loại và bỏ rác đúng nơi quy định.","Phụ giúp bố mẹ rửa bát, lau dọn bếp, chăm sóc cây xanh."]);
ESSAY("cn5","c1","Kể tên các bộ phận chính của ngôi nhà và nêu chức năng của từng bộ phận.",["Móng nhà: nằm sâu dưới đất, chống đỡ toàn bộ ngôi nhà.","Thân nhà (tường, cột, dầm, sàn): nâng đỡ mái, ngăn chia không gian, bảo vệ bên trong.","Mái nhà: phần trên cùng, che chắn mưa, nắng cho ngôi nhà.","Cửa (cửa ra vào, cửa sổ): đi lại, lấy ánh sáng, thông gió."]);
ESSAY("cn6","c2","Nêu các bước chính để xây dựng một ngôi nhà và công việc của từng bước.",["Bước 1 – Thiết kế: vẽ bản vẽ ngôi nhà, dự tính vật liệu, chi phí.","Bước 2 – Thi công thô: làm móng, dựng khung, xây tường, làm mái.","Bước 3 – Hoàn thiện: trát, sơn tường, lát nền, lắp điện nước, cửa, trang trí.","Trong quá trình xây dựng phải đảm bảo an toàn lao động và vệ sinh môi trường."]);
ESSAY("cn7","c2","Kể tên 3 vật liệu có sẵn trong tự nhiên và 3 vật liệu nhân tạo dùng để xây nhà. Vì sao nhà ở nông thôn xưa thường làm bằng tre, gỗ, lá?",["Vật liệu tự nhiên: cát, đá, sỏi, gỗ, tre, đất sét, lá…","Vật liệu nhân tạo: gạch nung, xi măng, thép, kính, ngói…","Nhà xưa làm bằng tre, gỗ, lá vì đây là vật liệu có sẵn ở địa phương.","Dễ kiếm, rẻ tiền, dễ làm, phù hợp với điều kiện kinh tế thời đó."]);
ESSAY("cn8","c2","Khi đi ngang qua một công trình đang xây dựng, em cần chú ý những gì để đảm bảo an toàn? Người thợ xây cần làm gì để làm việc an toàn?",["Đi tránh xa khu vực thi công, không vào bên trong công trường.","Không đứng dưới giàn giáo, cần cẩu; không nhặt vật liệu về chơi.","Người thợ cần đội mũ bảo hộ, mặc quần áo bảo hộ, đi giày bảo hộ.","Đeo dây an toàn khi làm việc trên cao; công trường cần có rào chắn, biển báo."]);
ESSAY("cn9","c2","Gia đình em định xây một ngôi nhà mới. Vì sao cần làm bước thiết kế trước khi thi công? Nếu bỏ qua bước này có thể xảy ra điều gì?",["Bước thiết kế giúp hình dung trước ngôi nhà: số phòng, vị trí, kích thước.","Giúp dự tính chính xác vật liệu và chi phí, tránh lãng phí.","Giúp người thợ thi công đúng kĩ thuật, ngôi nhà chắc chắn, an toàn.","Nếu bỏ qua: dễ xây sai, phải đập đi làm lại, tốn kém, nhà kém bền, không an toàn."]);
ESSAY("cn10","c2","Nhà em ở vùng thường xuyên có bão. Em đề xuất chọn vật liệu và kiểu nhà như thế nào cho phù hợp? Vì sao?",["Móng chắc chắn, dùng bê tông cốt thép cho móng, cột, khung nhà.","Tường xây gạch dày; mái thấp, mái bằng bê tông hoặc mái được neo chắc chắn.","Cửa chắc chắn, có thể chèn chống khi có bão.","Vì gió bão mạnh có thể làm tốc mái, đổ tường; nhà vững chắc giúp gia đình an toàn."]);
ESSAY("cn11","c3","Ngôi nhà thông minh là gì? Nêu 3 đặc điểm của ngôi nhà thông minh, mỗi đặc điểm lấy 1 ví dụ.",["Ngôi nhà thông minh là ngôi nhà được lắp đặt các thiết bị tự động hoặc điều khiển từ xa để tăng tiện nghi, an toàn, tiết kiệm.","Tiện ích: đèn, rèm cửa, điều hòa tự động hoặc điều khiển bằng điện thoại.","An ninh, an toàn: camera giám sát, khóa vân tay, báo cháy, báo trộm.","Tiết kiệm năng lượng: đèn cảm biến tự tắt, pin mặt trời, tận dụng ánh sáng tự nhiên."]);
ESSAY("cn12","c3","Nêu ít nhất 4 việc làm giúp sử dụng điện tiết kiệm, hiệu quả trong gia đình em.",["Tắt đèn, quạt, tivi khi ra khỏi phòng hoặc không sử dụng.","Dùng bóng đèn LED, chọn đồ dùng điện có nhãn tiết kiệm năng lượng.","Đặt điều hòa ở 26 – 28°C, đóng kín cửa khi bật; không mở tủ lạnh quá lâu.","Tận dụng ánh sáng, gió tự nhiên; rút phích cắm, sạc khi không dùng."]);
ESSAY("cn13","c3","Nêu các biện pháp sử dụng chất đốt (gas, than, củi) an toàn và tiết kiệm trong gia đình.",["Điều chỉnh ngọn lửa vừa với đáy nồi, không để lửa tràn ra ngoài.","Tắt bếp ngay khi nấu xong; khóa van bình gas sau khi sử dụng.","Không để bếp cháy khi không có người trông; để chất dễ cháy xa bếp.","Đun bếp than, củi ở nơi thông thoáng; thường xuyên kiểm tra dây dẫn gas."]);
ESSAY("cn14","c3","Nếu được thiết kế phòng ngủ của mình theo hướng “thông minh và tiết kiệm năng lượng”, em sẽ lắp đặt những thiết bị gì? Vì sao?",["Đèn LED cảm biến, tự tắt khi không có người → tiết kiệm điện.","Rèm cửa tự động hoặc cửa sổ lớn → tận dụng ánh sáng tự nhiên.","Điều hòa/quạt có hẹn giờ, điều khiển bằng điện thoại → tiện ích, không lãng phí.","Thiết bị báo khói, ổ cắm thông minh tự ngắt → an toàn."]);
ESSAY("cn15","c3","Khi phát hiện có mùi gas rò rỉ trong bếp, em sẽ xử lí như thế nào? Vì sao không được bật công tắc điện lúc đó?",["Khóa ngay van bình gas.","Mở hết cửa cho thông thoáng để gas thoát ra ngoài.","Không bật/tắt công tắc điện, không dùng lửa, không dùng điện thoại trong bếp; ra ngoài báo người lớn, gọi 114 nếu cần.","Vì bật công tắc điện có thể tạo tia lửa điện, gặp khí gas sẽ gây cháy nổ."]);

/* --- 5 đề Công nghệ --- */
const CN_GK_SETS = (() => {
  const les = ["c1", "c2", "c3"];
  const mcBy = les.map((l) => BANK.filter((q) => q.les === l && q.t === "mc"));
  const tfBy = les.map((l) => BANK.filter((q) => q.les === l && q.scen));
  const tfPlan = [[[0, 0], [1, 0], [2, 0], [2, 1]], [[0, 1], [0, 2], [1, 1], [2, 2]], [[0, 3], [1, 2], [1, 3], [2, 3]], [[0, 4], [1, 4], [2, 4], [2, 5]], [[0, 5], [0, 6], [1, 5], [2, 6]]];
  const essays = [["cn1", "cn6", "cn11"], ["cn2", "cn7", "cn12"], ["cn3", "cn8", "cn13"], ["cn5", "cn9", "cn14"], ["cn4", "cn10", "cn15"]];
  const sets = [];
  for (let d = 0; d < 5; d++) {
    const mc = [];
    les.forEach((l, i) => {
      const list = mcBy[i];
      for (let k = 0, got = 0; got < 4 && k < list.length * 2; k++) { const q = list[(d * 4 + k * 3) % list.length]; if (!mc.includes(q.id)) { mc.push(q.id); got++; } }
    });
    const tf = tfPlan[d].map(([li, j]) => tfBy[li][j].id);
    sets.push({ no: d + 1, mc: mc.concat(tf), essays: essays[d], weights: { mc: 0.25, tf: 1, sa: 0.25 }, tfLinear: true });
  }
  return sets;
})();
